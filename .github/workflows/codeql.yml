name: CodeQL Release Recovery

# Normal CodeQL analysis is a prerequisite job in prebuilt-binaries.yml and
# therefore runs only while publishing Current or a stable release. This
# workflow exists solely to recover analysis for an already published release;
# ordinary pushes, pull requests, documentation, and schedules must not run it.
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Published stable tag or current release to recover"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-release-recovery-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve Published Release
    if: github.repository == 'stephenlclarke/container-compose'
    runs-on: ubuntu-24.04
    outputs:
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
    steps:
      - name: Require an immutable published release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_REF}" != "current" &&
                ! "${RELEASE_REF}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            printf 'CodeQL recovery requires current or a stable semantic tag: %s\n' \
              "${RELEASE_REF}" >&2
            exit 1
          fi
          release="$(
            gh release view "${RELEASE_REF}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,tagName
          )"
          if [[ "$(jq -r .isDraft <<<"${release}")" != "false" ||
                "$(jq -r .tagName <<<"${release}")" != "${RELEASE_REF}" ]]; then
            printf 'CodeQL recovery release is not published and immutable: %s\n' \
              "${RELEASE_REF}" >&2
            exit 1
          fi
          printf 'checkout_ref=%s\n' "${RELEASE_REF}" >> "${GITHUB_OUTPUT}"

  analyze:
    name: Analyze Go Release
    needs: resolve-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.checkout_ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: Tools/compose-normalizer/go.mod
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: go
          build-mode: manual
          config-file: .github/codeql/codeql-config.yml
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.26.2/codeql-bundle-linux64.tar.gz

      - name: Build Go normalizer for CodeQL
        timeout-minutes: 10
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
          GOCACHE: ${{ runner.temp }}/codeql-go-build-cache
          GOENV: "off"
          GOFLAGS: -mod=readonly
          GOMODCACHE: ${{ runner.temp }}/codeql-go-module-cache
          GONOPROXY: ""
          GONOSUMDB: ""
          GOOS: linux
          GOPRIVATE: ""
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOVCS: "*:off"
          GOWORK: "off"
        run: |
          rm -rf "$GOCACHE" "$GOMODCACHE"
          mkdir -p "$GOCACHE" "$GOMODCACHE"
          make go-build

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:swift-go"

  verify:
    name: CodeQL
    needs: analyze
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful release analysis
        env:
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ANALYSIS_RESULT}" != "success" ]]; then
            printf 'CodeQL release analysis did not complete successfully: %s\n' \
              "${ANALYSIS_RESULT}" >&2
            exit 1
          fi
