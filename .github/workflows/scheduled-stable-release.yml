name: Scheduled Stable Release
run-name: Unattended Stable Release · ${{ inputs.intent || 'milestone' }} · ${{ inputs.version_selector || 'auto' }}

on:
  schedule:
    # Monday 09:17 UTC deliberately avoids the busiest minute of the hour.
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      intent:
        description: "Release policy"
        required: true
        default: "milestone"
        type: choice
        options:
          - "milestone"
          - "maintenance"
          - "security"
      version_selector:
        description: "auto, --+, -+-, +--, or an exact MAJOR.MINOR.PATCH"
        required: true
        default: "auto"
        type: string
      reason:
        description: "Required operational/advisory reason for maintenance or security"
        required: false
        default: ""
        type: string
      soak_override_reason:
        description: "Exceptional milestone-only Current soak override"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: scheduled-stable-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Decide Stable Promotion
    if: github.repository == 'stephenlclarke/container-compose' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.decision.outputs.should_release }}
      selector: ${{ steps.request.outputs.selector }}
      intent: ${{ steps.request.outputs.intent }}
      maintenance_reason: ${{ steps.request.outputs.maintenance_reason }}
      security_reason: ${{ steps.request.outputs.security_reason }}
      soak_override_reason: ${{ steps.request.outputs.soak_override_reason }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - name: Checkout release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate unattended release request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INTENT: ${{ inputs.intent || 'milestone' }}
          REASON: ${{ inputs.reason || '' }}
          SELECTOR: ${{ inputs.version_selector || 'auto' }}
          SOAK_OVERRIDE_REASON: ${{ inputs.soak_override_reason || '' }}
        shell: bash
        run: |
          set -euo pipefail
          existing_release_argument=()
          if [[ "${SELECTOR}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] &&
            git ls-remote --exit-code --tags --refs origin "refs/tags/${SELECTOR}" >/dev/null; then
            existing_release_argument=(--existing-release)
          fi
          request="$(python3 Tools/release/unattended-release-request.py \
            --event-name "${EVENT_NAME}" \
            --intent "${INTENT}" \
            --selector="${SELECTOR}" \
            --reason "${REASON}" \
            --soak-override-reason "${SOAK_OVERRIDE_REASON}" \
            "${existing_release_argument[@]}")"
          INTENT="$(jq -r '.intent' <<<"${request}")"
          SELECTOR="$(jq -r '.selector' <<<"${request}")"
          maintenance_reason="$(jq -r '.maintenance_reason' <<<"${request}")"
          security_reason="$(jq -r '.security_reason' <<<"${request}")"
          SOAK_OVERRIDE_REASON="$(jq -r '.soak_override_reason' <<<"${request}")"
          requested_selector="${SELECTOR}"
          case "${SELECTOR}" in
            auto)
              SELECTOR="$(python3 Tools/release/conventional-version.py \
                --format selector --allow-no-release)"
              ;;
            --+|-+-|+--)
              ;;
            [0-9]*.[0-9]*.[0-9]*)
              if ! [[ "${SELECTOR}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
                printf 'invalid exact stable release version: %s\n' "${SELECTOR}" >&2
                exit 2
              fi
              ;;
            *)
              printf 'stable release selector must be auto, --+, -+-, +--, or MAJOR.MINOR.PATCH: %s\n' \
                "${SELECTOR}" >&2
              exit 2
              ;;
          esac
          case "${SELECTOR}" in
            --+|-+-|+--|[0-9]*.[0-9]*.[0-9]*)
              printf 'selector=%s\n' "${SELECTOR}" >> "$GITHUB_OUTPUT"
              ;;
            "")
              [[ "${requested_selector}" == "auto" ]]
              printf 'selector=\n' >> "$GITHUB_OUTPUT"
              ;;
            *)
              printf 'conventional version resolver returned an invalid selector: %s\n' \
                "${SELECTOR}" >&2
              exit 2
              ;;
          esac
          {
            printf 'intent=%s\n' "${INTENT}"
            printf 'maintenance_reason=%s\n' "${maintenance_reason}"
            printf 'security_reason=%s\n' "${security_reason}"
            printf 'soak_override_reason=%s\n' "${SOAK_OVERRIDE_REASON}"
          } >> "$GITHUB_OUTPUT"

      - name: Require a soaked, changed Current build
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_INTENT: ${{ steps.request.outputs.intent }}
          SELECTED_SELECTOR: ${{ steps.request.outputs.selector }}
          SOAK_OVERRIDE_REASON: ${{ steps.request.outputs.soak_override_reason }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"

          resolve_tag_sha() {
            local tag="$1" sha
            sha="$(
              git ls-remote --tags "${remote}" "refs/tags/${tag}" "refs/tags/${tag}^{}" \
                | awk '$2 ~ /\^\{\}$/ { print $1; found = 1 } END { if (!found) print "" }' \
                | tail -n 1
            )"
            if [[ -z "${sha}" ]]; then
              sha="$(
                git ls-remote --tags --refs "${remote}" "refs/tags/${tag}" \
                  | awk '{ print $1 }' \
                  | tail -n 1
              )"
            fi
            printf '%s' "${sha}"
          }

          main_sha="$(git ls-remote --heads "${remote}" refs/heads/main | awk '{ print $1 }' | tail -n 1)"
          current_tag="current-${main_sha}"
          current_sha="$(resolve_tag_sha "${current_tag}")"
          current_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${current_tag}")"
          current_runs="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/prebuilt-binaries.yml/runs?head_sha=${main_sha}&status=success&per_page=100"
          )"
          container_formula="$(
            gh api -H 'Accept: application/vnd.github.raw+json' \
              'repos/stephenlclarke/homebrew-tap/contents/Formula/container-current.rb?ref=main'
          )"
          compose_formula="$(
            gh api -H 'Accept: application/vnd.github.raw+json' \
              'repos/stephenlclarke/homebrew-tap/contents/Formula/container-compose-current.rb?ref=main'
          )"
          current_built_at="$(
            jq -n \
              --argjson release "${current_release}" \
              --argjson runs "${current_runs}" \
              --arg container_formula "${container_formula}" \
              --arg compose_formula "${compose_formula}" \
              '{release: $release, runs: $runs, container_formula: $container_formula, compose_formula: $compose_formula}' \
              | python3 Tools/release/verify-current-release-readiness.py \
                  --repository "${GITHUB_REPOSITORY}" \
                  --tag "${current_tag}" \
                  --sha "${main_sha}"
          )"
          latest_stable_tag="$(
            git ls-remote --tags --refs "${remote}" \
              | awk '{ sub("^refs/tags/", "", $2); print $2 }' \
              | awk '/^[0-9]+[.][0-9]+[.][0-9]+$/' \
              | sort -V \
              | tail -n 1
          )"
          latest_stable_sha=""
          if [[ -n "${latest_stable_tag}" ]]; then
            latest_stable_sha="$(resolve_tag_sha "${latest_stable_tag}")"
          fi
          if [[ ! "${main_sha}" =~ ^[0-9a-f]{40}$ || ! "${current_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'could not resolve main or current tag SHA\n' >&2
            exit 1
          fi
          if [[ -z "${current_built_at}" ]]; then
            printf 'current must have a complete immutable release and package authority\n' >&2
            exit 1
          fi

          decision_file="${RUNNER_TEMP}/stable-release-decision.json"
          python3 Tools/release/stable-release-preflight.py \
            --main-sha "${main_sha}" \
            --current-sha "${current_sha}" \
            --current-built-at "${current_built_at}" \
            --latest-stable-sha "${latest_stable_sha}" > "${decision_file}"
          should_release="$(jq -r '.should_release' "${decision_file}")"
          reason="$(jq -r '.reason' "${decision_file}")"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" &&
            ("${RELEASE_INTENT}" != "milestone" || -n "${SOAK_OVERRIDE_REASON}") ]]; then
            should_release=true
            reason="Manual ${RELEASE_INTENT} release request passed immutable Current authority preflight."
          fi
          if [[ "${should_release}" == "true" && -z "${SELECTED_SELECTOR}" ]]; then
            should_release=false
            reason="Current is newer, but Conventional Commit history contains no release-producing change."
          fi
          printf 'should_release=%s\n' "${should_release}" >> "$GITHUB_OUTPUT"
          printf 'reason=%s\n' "${reason}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${reason}" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Promote Soaked Stable Release
    needs: preflight
    if: needs.preflight.outputs.should_release == 'true'
    runs-on: [self-hosted, macOS, ARM64, container-compose-release]
    timeout-minutes: 360
    outputs:
      version: ${{ steps.promote.outputs.version }}
      stable_gate_run_id: ${{ steps.promote.outputs.stable_gate_run_id }}
      control_sha: ${{ steps.promote.outputs.control_sha }}
      release_was_published: ${{ steps.promote.outputs.release_was_published }}
    steps:
      - name: Checkout container-compose release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: release-controls/container-compose
          fetch-depth: 0
          persist-credentials: false

      # This inline workflow step is the trust root for unattended recovery.
      # It must run before Make, Bash, or Python consumes any checked-out file;
      # the controller repeats the check later only as defence in depth.
      - name: Verify exact release bootstrap closure
        shell: bash
        working-directory: release-controls/container-compose
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          bootstrap_closure=(
            Makefile
            scripts/CONTAINER_STACK_RELEASE.sh
            Tools/ci/container-runtime-lock.sh
            Tools/ci/run-command-with-deadline.py
            Tools/release/release-host-state.py
            Tools/release/release-workspace.py
            Tools/release/temporary-developer-id-keychain.sh
            Tools/release/unattended-release-request.py
          )
          origin_url="$(git remote get-url origin)"
          case "${origin_url}" in
            https://github.com/stephenlclarke/container-compose|https://github.com/stephenlclarke/container-compose.git|git@github.com:stephenlclarke/container-compose|git@github.com:stephenlclarke/container-compose.git) ;;
            *)
              printf 'release bootstrap origin is not stephenlclarke/container-compose: %s\n' \
                "${origin_url:-missing}" >&2
              exit 1
              ;;
          esac
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}' | tail -n 1)"
          if [[ ! "${EXPECTED_HEAD}" =~ ^[0-9a-f]{40}$ ]] ||
            [[ "${local_head}" != "${EXPECTED_HEAD}" ]] ||
            [[ "${remote_head}" != "${EXPECTED_HEAD}" ]]; then
            printf 'unattended release bootstrap is not exact reviewed main: workflow %s, local %s, remote %s\n' \
              "${EXPECTED_HEAD:-missing}" "${local_head:-missing}" \
              "${remote_head:-missing}" >&2
            exit 1
          fi
          if [[ -n "$(git status --short)" ]]; then
            printf 'unattended release bootstrap checkout is dirty\n' >&2
            exit 1
          fi
          for relative_path in "${bootstrap_closure[@]}"; do
            if [[ ! -f "${relative_path}" || -L "${relative_path}" ]]; then
              printf 'release bootstrap closure file is missing or unsafe: %s\n' \
                "${relative_path}" >&2
              exit 1
            fi
            index_entry="$(git ls-files -v -- "${relative_path}")"
            if [[ -z "${index_entry}" || "${index_entry}" == S\ * ||
              "${index_entry:0:1}" =~ [a-z] ]]; then
              printf 'release bootstrap closure has hidden index state: %s\n' \
                "${relative_path}" >&2
              exit 1
            fi
            expected_blob="$(git rev-parse "HEAD:${relative_path}")"
            actual_blob="$(git hash-object --no-filters "${relative_path}")"
            if [[ ! "${expected_blob}" =~ ^[0-9a-f]{40}$ ]] ||
              [[ "${actual_blob}" != "${expected_blob}" ]]; then
              printf 'release bootstrap closure differs from reviewed HEAD: %s\n' \
                "${relative_path}" >&2
              exit 1
            fi
          done

      - name: Install operation-scoped Developer ID identity
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          DEVELOPER_ID_EXPECTED_IDENTITY: ${{ vars.DEVELOPER_ID_APPLICATION_SIGNING_IDENTITY }}
          DEVELOPER_ID_TEMPORARY_ROOT: ${{ runner.temp }}
          DEVELOPER_ID_KEYCHAIN: ${{ runner.temp }}/container-compose-controller-${{ github.run_id }}-${{ github.run_attempt }}.keychain-db
          DEVELOPER_ID_ORIGINAL_KEYCHAINS: ${{ runner.temp }}/container-compose-controller-${{ github.run_id }}-${{ github.run_attempt }}.keychains
          DEVELOPER_ID_ENVIRONMENT_FILE: ${{ github.env }}
        shell: bash
        run: release-controls/container-compose/Tools/release/temporary-developer-id-keychain.sh install

      - name: Configure isolated release controller
        env:
          GH_TOKEN: ${{ secrets.CONTAINER_FAMILY_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            printf 'CONTAINER_FAMILY_RELEASE_TOKEN is required\n' >&2
            exit 1
          fi
          if [[ "$(gh api user --jq '.login')" != "stephenlclarke" ]]; then
            printf 'the unattended release token must authenticate as stephenlclarke\n' >&2
            exit 1
          fi

          gh auth setup-git

          for command_name in docker gh git go make node npm python3 swift; do
            command -v "${command_name}" >/dev/null 2>&1 || {
              printf 'release runner is missing %s\n' "${command_name}" >&2
              exit 1
            }
          done
          docker compose version >/dev/null
          [[ -n "$(git config --global --get user.name)" ]]
          [[ -n "$(git config --global --get user.email)" ]]
          [[ "$(git config --global --get gpg.format)" == "ssh" ]]
          [[ "$(git config --global --get commit.gpgsign)" == "true" ]]
          signing_key="$(git config --global --get user.signingkey)"
          [[ -n "${signing_key}" && -r "${signing_key}" ]]
          signing_private_key="${signing_key%.pub}"
          ssh-keygen -y -P '' -f "${signing_private_key}" >/dev/null

      - name: Promote the selected stable release
        id: promote
        shell: bash
        working-directory: release-controls/container-compose
        env:
          CONTAINER_STACK_RELEASE_BUILD_ROOT: /Volumes/SSD/github/container-compose-release-transactions
          CONTAINER_STACK_MAINTENANCE_REASON: ${{ needs.preflight.outputs.maintenance_reason }}
          CONTAINER_STACK_MILESTONE_SOAK_OVERRIDE_REASON: ${{ needs.preflight.outputs.soak_override_reason }}
          CONTAINER_STACK_RELEASE_INTENT: ${{ needs.preflight.outputs.intent }}
          CONTAINER_STACK_SECURITY_REASON: ${{ needs.preflight.outputs.security_reason }}
          GH_TOKEN: ${{ secrets.CONTAINER_FAMILY_RELEASE_TOKEN }}
          VERSION_SELECTOR: ${{ needs.preflight.outputs.selector }}
        run: |
          set -euo pipefail
          export CONTAINER_STACK_RELEASE_ASYNC_AFTER_STABLE_GATE=1
          export CONTAINER_STACK_RELEASE_ASYNC_HANDOFF_OUTPUT="${GITHUB_OUTPUT}"
          make release VERSION_SELECTOR="${VERSION_SELECTOR}"

      - name: Remove operation-scoped Developer ID identity
        if: always()
        env:
          DEVELOPER_ID_TEMPORARY_ROOT: ${{ runner.temp }}
          DEVELOPER_ID_KEYCHAIN: ${{ runner.temp }}/container-compose-controller-${{ github.run_id }}-${{ github.run_attempt }}.keychain-db
          DEVELOPER_ID_ORIGINAL_KEYCHAINS: ${{ runner.temp }}/container-compose-controller-${{ github.run_id }}-${{ github.run_attempt }}.keychains
        shell: bash
        run: |
          set -euo pipefail
          helper=release-controls/container-compose/Tools/release/temporary-developer-id-keychain.sh
          if [[ ! -e "${DEVELOPER_ID_KEYCHAIN}" &&
            ! -e "${DEVELOPER_ID_ORIGINAL_KEYCHAINS}" ]]; then
            exit 0
          fi
          if [[ ! -x "${helper}" ]]; then
            printf 'cannot safely restore the Developer ID keychain search list: %s is unavailable\n' \
              "${helper}" >&2
            exit 1
          fi
          "${helper}" cleanup

  complete:
    name: Complete Stable Release Off-Runner
    needs: [preflight, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.version }}
      STABLE_GATE_RUN_ID: ${{ needs.release.outputs.stable_gate_run_id }}
      CONTROL_SHA: ${{ needs.release.outputs.control_sha }}
      RELEASE_WAS_PUBLISHED: ${{ needs.release.outputs.release_was_published }}
    steps:
      - name: Wait for gate, package, documentation, and immutable publication
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] ||
            [[ ! "${STABLE_GATE_RUN_ID}" =~ ^[0-9]+$ ]] ||
            [[ ! "${CONTROL_SHA}" =~ ^[0-9a-f]{40}$ ]] ||
            [[ "${RELEASE_WAS_PUBLISHED}" != true &&
              "${RELEASE_WAS_PUBLISHED}" != false ]] ||
            [[ "${CONTROL_SHA}" != "${GITHUB_SHA}" ]]; then
            printf 'stable release handoff is incomplete or stale\n' >&2
            exit 1
          fi
          dispatch_and_wait() {
            local workflow="$1" run_id request_id
            local -a extra_inputs=()
            if (( $# > 1 )); then
              extra_inputs=(-F "inputs[repair_tap]=$2")
            fi
            request_id="$(</proc/sys/kernel/random/uuid)"
            run_id="$(
              gh api --method POST \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
                -f ref=main \
                -f "inputs[ref]=${RELEASE_TAG}" \
                -f "inputs[expected_control_sha]=${CONTROL_SHA}" \
                -f "inputs[request_id]=${request_id}" \
                "${extra_inputs[@]}" \
                --jq '.workflow_run_id'
            )"
            if [[ ! "${run_id}" =~ ^[0-9]+$ ]]; then
              printf 'GitHub did not return a run ID for %s\n' "${workflow}" >&2
              exit 1
            fi
            gh run watch "${run_id}" \
              --repo "${GITHUB_REPOSITORY}" \
              --exit-status \
              --interval 30
          }

          gh run watch "${STABLE_GATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --exit-status \
            --interval 30
          if [[ "${RELEASE_WAS_PUBLISHED}" == false ]]; then
            dispatch_and_wait prebuilt-binaries.yml false
          else
            latest="$(
              gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name'
            )"
            formula_current=true
            if [[ "${latest}" == "${RELEASE_TAG}" ]]; then
              for formula in container container-compose; do
                contents="$(
                  gh api -H 'Accept: application/vnd.github.raw+json' \
                    "repos/stephenlclarke/homebrew-tap/contents/Formula/${formula}.rb?ref=main"
                )"
                if ! grep -F "/releases/download/${RELEASE_TAG}/" \
                  <<<"${contents}" >/dev/null; then
                  formula_current=false
                fi
              done
              if [[ "${formula_current}" == false ]]; then
                dispatch_and_wait prebuilt-binaries.yml true
              fi
            fi
          fi
          dispatch_and_wait docs.yml

          release="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          )"
          jq -e --arg tag "${RELEASE_TAG}" '(
            .tag_name == $tag and
            .draft == false and
            .prerelease == false and
            .immutable == true
          )' <<<"${release}" >/dev/null
          latest="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name'
          )"
          if [[ "${latest}" == "${RELEASE_TAG}" ]]; then
            for formula in container container-compose; do
              contents="$(
                gh api -H 'Accept: application/vnd.github.raw+json' \
                  "repos/stephenlclarke/homebrew-tap/contents/Formula/${formula}.rb?ref=main"
              )"
              grep -F "/releases/download/${RELEASE_TAG}/" \
                <<<"${contents}" >/dev/null
            done
          fi
          printf 'Published and verified container-compose %s.\n' \
            "${RELEASE_TAG}" >>"${GITHUB_STEP_SUMMARY}"
