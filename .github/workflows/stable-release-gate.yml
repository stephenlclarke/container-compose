name: Stable Release Gate
run-name: Stable Release Gate · ${{ inputs.ref }} · ${{ inputs.request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Bare semantic tag to validate and promote"
        required: true
        type: string
      expected_control_sha:
        description: "Controller-observed main SHA for race-safe dispatch"
        required: false
        type: string
      request_id:
        description: "Durable controller request identifier"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: stable-release-gate-${{ inputs.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  resolve-candidate:
    name: Resolve Stable Candidate
    if: github.repository == 'stephenlclarke/container-compose'
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      authority_ref: ${{ steps.candidate.outputs.authority_ref }}
      control_sha: ${{ steps.candidate.outputs.control_sha }}
      homebrew_tap_ref: ${{ steps.candidate.outputs.homebrew_tap_ref }}
      init_image_sha256: ${{ steps.candidate.outputs.init_image_sha256 }}
      init_image_authority_object: ${{ steps.candidate.outputs.init_image_authority_object }}
    steps:
      - name: Verify dispatch identity
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [[ -n "${EXPECTED_CONTROL_SHA}" && \
            ( ! "${EXPECTED_CONTROL_SHA}" =~ ^[0-9a-f]{40}$ || \
              "${GITHUB_SHA}" != "${EXPECTED_CONTROL_SHA}" ) ]]; then
            printf 'stable gate controls changed before execution: expected %s, got %s\n' \
              "${EXPECTED_CONTROL_SHA:-missing}" "${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ -n "${REQUEST_ID}" && ! "${REQUEST_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            printf 'stable gate request ID is invalid: %s\n' "${REQUEST_ID}" >&2
            exit 1
          fi

      - name: Require an immutable main tag and green main CI
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            printf 'stable release ref must be a bare semantic tag: %s\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          tag_sha="$(
            git ls-remote --tags "${remote}" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
              | awk '$2 ~ /\^\{\}$/ { print $1 }' \
              | tail -n 1
          )"
          if [[ -z "${tag_sha}" ]]; then
            tag_sha="$(
              git ls-remote --tags --refs "${remote}" "refs/tags/${RELEASE_TAG}" \
                | awk '{ print $1 }' \
                | tail -n 1
            )"
          fi
          main_sha="$(git ls-remote --heads "${remote}" refs/heads/main | awk '{ print $1 }' | tail -n 1)"
          if [[ ! "${tag_sha}" =~ ^[0-9a-f]{40}$ ]] || [[ -z "${main_sha}" ]]; then
            printf 'could not resolve stable tag %s or main\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]] ||
            [[ "${GITHUB_SHA}" != "${main_sha}" ]]; then
            printf 'stable release control must run from the exact current main revision (%s, got %s at %s)\n' \
              "${main_sha}" "${GITHUB_SHA}" "${GITHUB_REF}" >&2
            exit 1
          fi
          tag_object="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha'
          )"
          tag_verified="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified'
          )"
          if [[ "${tag_verified}" != "true" ]]; then
            printf 'stable tag %s is not GitHub-verified\n' "${RELEASE_TAG}" >&2
            exit 1
          fi

          init_image_authority_tag="stable-init-image-authority/${RELEASE_TAG}"
          init_image_authority_object="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${init_image_authority_tag}" \
              --jq '.object.sha'
          )"
          init_image_authority="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${init_image_authority_object}"
          )"
          init_image_authority_verified="$(
            jq -r '.verification.verified' <<<"${init_image_authority}"
          )"
          init_image_authority_source="$(
            jq -r '.object.sha' <<<"${init_image_authority}"
          )"
          init_image_authority_message="$(
            jq -r '.message' <<<"${init_image_authority}"
          )"
          init_image_digest_lines="$(
            sed -nE 's/^Guest init image SHA-256: ([0-9a-f]{64})[.]$/\1/p' \
              <<<"${init_image_authority_message}"
          )"
          if [[ "${init_image_authority_verified}" != "true" ]]; then
            printf 'stable init-image authority tag %s is not GitHub-verified\n' \
              "${init_image_authority_tag}" >&2
            exit 1
          fi
          if [[ "${init_image_authority_source}" != "${tag_sha}" ]]; then
            printf 'stable init-image authority tag names %s instead of candidate %s\n' \
              "${init_image_authority_source:-missing}" "${tag_sha}" >&2
            exit 1
          fi
          if [[ ! "${init_image_digest_lines}" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'stable init-image authority tag has no unique candidate-bound digest\n' >&2
            exit 1
          fi
          INIT_IMAGE_SHA256="${init_image_digest_lines}"

          release_output=""
          set +e
          release_output="$(
            gh api --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>&1
          )"
          release_status=$?
          set -e
          if (( release_status == 0 )); then
            printf 'stable release %s already exists and is immutable\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "${release_output}" != *"HTTP 404"* ]]; then
            printf 'could not determine whether stable release %s exists:\n%s\n' \
              "${RELEASE_TAG}" "${release_output}" >&2
            exit 1
          fi

          if [[ "${tag_sha}" != "${main_sha}" ]]; then
            printf 'stable tag %s no longer matches main; accepting its GitHub-verified unpublished source for a release retry\n' \
              "${RELEASE_TAG}"
          fi

          release_series="${RELEASE_TAG%.*}"
          release_branch="release-${release_series}"
          release_branch_sha="$(
            git ls-remote --heads "${remote}" "refs/heads/${release_branch}" |
              awk '{ print $1 }' |
              tail -n 1
          )"
          if [[ "${tag_sha}" == "${main_sha}" ]]; then
            authority_ref="main"
            candidate_ci_branch="main"
          elif [[ "${tag_sha}" == "${release_branch_sha}" ]]; then
            # Maintenance tags run the exact release-branch workflow on their
            # tag push, including the serialized Sonar candidate/restoration
            # transaction. Their immutable CI authority is therefore the tag.
            authority_ref="${release_branch}"
            candidate_ci_branch="${RELEASE_TAG}"
          else
            # An unpublished latest tag can outlive main when release-control
            # automation is repaired after the tag was signed. Its payload
            # authority remains the immutable tag and original main CI; the
            # current main head independently owns the retry's control tools.
            authority_ref="main"
            candidate_ci_branch="main"
          fi

          semantic_tags="$(
            git ls-remote --tags --refs "${remote}" \
              | awk '{ sub("^refs/tags/", "", $2); print $2 }' \
              | awk '/^[0-9]+[.][0-9]+[.][0-9]+$/'
          )"
          latest_stable_tag="$(sort -V <<<"${semantic_tags}" | tail -n 1)"
          if [[ "${authority_ref}" == "main" ]]; then
            if [[ "${latest_stable_tag}" != "${RELEASE_TAG}" ]]; then
              printf 'stable tag %s is not the latest semantic source tag (%s)\n' \
                "${RELEASE_TAG}" "${latest_stable_tag:-missing}" >&2
              exit 1
            fi
          else
            latest_series_tag="$(
              awk -v prefix="${release_series}." 'index($0, prefix) == 1' <<<"${semantic_tags}" |
                sort -V |
                tail -n 1
            )"
            if [[ "${latest_series_tag}" != "${RELEASE_TAG}" ]]; then
              printf 'maintenance tag %s is not the latest semantic tag in series %s (%s)\n' \
                "${RELEASE_TAG}" "${release_series}" "${latest_series_tag:-missing}" >&2
              exit 1
            fi
          fi

          homebrew_tap_ref="$(
            git ls-remote --heads https://github.com/stephenlclarke/homebrew-tap.git refs/heads/main \
              | awk '{ print $1 }' \
              | tail -n 1
          )"
          if [[ ! "${homebrew_tap_ref}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'could not resolve an immutable homebrew-tap main revision\n' >&2
            exit 1
          fi

          # Maintenance CI can legitimately consume its full 250-minute
          # runtime budget while waiting for and holding Sonar authority.
          deadline=$((SECONDS + 15600))
          sonar_evidence_attempts=0
          while true; do
            run="$(
              gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${tag_sha}" \
                --event push --limit 20 --json databaseId,status,conclusion,headBranch \
                --jq "map(select(.headBranch == \"${candidate_ci_branch}\") | select(.status == \"completed\" or .status == \"in_progress\" or .status == \"queued\")) | .[0] // empty"
            )"
            status="$(jq -r '.status // empty' <<<"${run}")"
            conclusion="$(jq -r '.conclusion // empty' <<<"${run}")"
            if [[ "${status}" == "completed" && "${conclusion}" == "success" ]]; then
              run_id="$(jq -r '.databaseId // empty' <<<"${run}")"
              ci_jobs="$(
                gh api --paginate --slurp \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100"
              )"
              sonar_conclusions="$(
                jq -c '[.[] | .jobs[] | select(.name == "Validate Runtime") |
                  .steps[]? | select(.name == "Record successful SonarQube analysis") | .conclusion]' \
                  <<<"${ci_jobs}"
              )"
              if jq -e 'length == 1 and .[0] == "success"' \
                <<<"${sonar_conclusions}" >/dev/null; then
                break
              fi
              if jq -e 'length == 0 or any(.[]; . == null)' \
                <<<"${sonar_conclusions}" >/dev/null; then
                ((sonar_evidence_attempts += 1))
                if (( sonar_evidence_attempts < 12 )); then
                  printf 'CI SonarQube evidence for run %s is not visible yet; retrying %s/12 in 5s\n' \
                    "${run_id}" "$((sonar_evidence_attempts + 1))"
                  sleep 5
                  continue
                fi
              fi
              printf '%s CI for %s did not complete the required SonarQube scan: %s\n' \
                "${candidate_ci_branch}" "${tag_sha}" "${sonar_conclusions}" >&2
              exit 1
            fi
            if [[ "${status}" == "completed" ]]; then
              printf '%s CI for %s concluded %s\n' \
                "${candidate_ci_branch}" "${tag_sha}" "${conclusion:-missing}" >&2
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              printf 'timed out waiting for green %s CI (including SonarQube) at %s\n' \
                "${candidate_ci_branch}" "${tag_sha}" >&2
              exit 1
            fi
            printf 'waiting for %s CI (including SonarQube) at %s\n' \
              "${candidate_ci_branch}" "${tag_sha}"
            sleep 30
          done

          {
            printf 'sha=%s\n' "${tag_sha}"
            printf 'authority_ref=%s\n' "${authority_ref}"
            printf 'control_sha=%s\n' "${main_sha}"
            printf 'homebrew_tap_ref=%s\n' "${homebrew_tap_ref}"
            printf 'init_image_sha256=%s\n' "${INIT_IMAGE_SHA256}"
            printf 'init_image_authority_object=%s\n' "${init_image_authority_object}"
          } >> "$GITHUB_OUTPUT"

  release-gate:
    name: Run Hosted Release Gate
    needs: resolve-candidate
    runs-on: [self-hosted, macOS, ARM64, container-compose-release]
    timeout-minutes: 120
    outputs:
      authority_artifact_digest: ${{ steps.upload-authority.outputs.artifact-digest }}
      authority_artifact_id: ${{ steps.upload-authority.outputs.artifact-id }}
      authority_receipt_sha256: ${{ steps.authority-receipt.outputs.sha256 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout the stable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: container-compose
          fetch-depth: 0
          ref: ${{ needs.resolve-candidate.outputs.sha }}

      # Stable tags are immutable, so use the immutable workflow revision for
      # release-control tooling while validating the tag checkout separately.
      - name: Checkout immutable stable-gate tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: release-tools
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Read exact stack refs
        id: stack-refs
        shell: bash
        working-directory: container-compose
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          components = json.loads(Path("Tools/release/stack-refs.json").read_text(encoding="utf-8"))["components"]
          for name in ("container-builder-shim", "containerization", "container"):
              ref = components[name]["ref"]
              if len(ref) != 40:
                  raise SystemExit(f"{name} ref is not immutable: {ref}")
              print(f"{name.replace('-', '_')}_ref={ref}")
          PY

      - name: Checkout pinned stack dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/container-builder-shim
          path: container-builder-shim
          fetch-depth: 0
          ref: ${{ steps.stack-refs.outputs.container_builder_shim_ref }}

      - name: Checkout pinned containerization dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/containerization
          path: containerization
          fetch-depth: 0
          ref: ${{ steps.stack-refs.outputs.containerization_ref }}

      - name: Checkout pinned runtime dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/container
          path: container
          fetch-depth: 0
          ref: ${{ steps.stack-refs.outputs.container_ref }}

      - name: Checkout immutable Homebrew tap snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/homebrew-tap
          path: homebrew-tap
          fetch-depth: 0
          ref: ${{ needs.resolve-candidate.outputs.homebrew_tap_ref }}

      - name: Verify immutable dependency checkouts
        env:
          BUILDER_REF: ${{ steps.stack-refs.outputs.container_builder_shim_ref }}
          CONTAINERIZATION_REF: ${{ steps.stack-refs.outputs.containerization_ref }}
          CONTAINER_REF: ${{ steps.stack-refs.outputs.container_ref }}
          HOMEBREW_TAP_REF: ${{ needs.resolve-candidate.outputs.homebrew_tap_ref }}
          CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C container-builder-shim rev-parse HEAD)" == "${BUILDER_REF}" ]]
          [[ "$(git -C containerization rev-parse HEAD)" == "${CONTAINERIZATION_REF}" ]]
          [[ "$(git -C container rev-parse HEAD)" == "${CONTAINER_REF}" ]]
          [[ "$(git -C homebrew-tap rev-parse HEAD)" == "${HOMEBREW_TAP_REF}" ]]
          [[ "$(git -C release-tools rev-parse HEAD)" == "${CONTROL_SHA}" ]]

      - name: Resolve persistent release state root
        env:
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[[:xdigit:]]{40}$ ]]
          workspace_root="$(cd "${GITHUB_WORKSPACE}" && pwd -P)"
          retained_root="${HOME}/Library/Application Support/ContainerFamily/retained"
          retained_marker="${retained_root}/.container-family-retained-root"
          [[ ! -L "${retained_root}" ]] || {
            printf 'Retained release root is a symbolic link: %s\n' \
              "${retained_root}" >&2
            exit 2
          }
          if [[ -d "${retained_root}" && ! -f "${retained_marker}" ]] && \
            [[ -n "$(find "${retained_root}" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
            printf 'Refusing to claim non-empty unmarked retained root: %s\n' \
              "${retained_root}" >&2
            exit 2
          fi
          mkdir -p "${retained_root}"
          if [[ -L "${retained_marker}" ]] || \
            [[ -e "${retained_marker}" && ! -f "${retained_marker}" ]]; then
            printf 'Retained release marker is unsafe: %s\n' \
              "${retained_marker}" >&2
            exit 2
          fi
          if [[ -f "${retained_marker}" ]]; then
            [[ "$(<"${retained_marker}")" == \
              'container-compose retained build v2' ]]
          else
            printf 'container-compose retained build v2\n' > "${retained_marker}"
            chmod 0600 "${retained_marker}"
          fi
          state_parent="${retained_root}/release/checkpoints"
          if [[ -L "${state_parent}" ]]; then
            printf 'Release state parent must not be a symbolic link: %s\n' \
              "${state_parent}" >&2
            exit 2
          fi
          mkdir -p "${state_parent}"
          state_parent="$(cd "${state_parent}" && pwd -P)"
          state_root="${state_parent}/${CANDIDATE_SHA}"
          if [[ -L "${state_root}" ]]; then
            printf 'Candidate release state must not be a symbolic link: %s\n' \
              "${state_root}" >&2
            exit 2
          fi
          mkdir -p "${state_root}"
          state_root="$(cd "${state_root}" && pwd -P)"
          case "${state_root}" in
            "${workspace_root}"|"${workspace_root}"/*)
              printf 'Release state root must be outside the disposable job workspace: %s\n' \
                "${state_root}" >&2
              exit 2
              ;;
          esac
          printf 'RELEASE_BUILD_STATE_ROOT=%s\n' "${state_root}" >> "${GITHUB_ENV}"
          printf 'Candidate-keyed release state: %s\n' "${state_root}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: container-compose/Tools/compose-normalizer/go.mod
          cache-dependency-path: container-compose/Tools/compose-normalizer/go.sum

      - name: Cache local repo tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            container-compose/.local/bin
            container-compose/.local/cache/hawkeye
          key: ${{ runner.os }}-${{ runner.arch }}-local-tools-hawkeye-v6.5.1

      - name: Provision checksum-pinned repository tools
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        working-directory: container-compose
        run: |
          set -euo pipefail
          ./scripts/install-hawkeye.sh

      # This self-hosted release runner executes the release-only sibling proof.
      # The release helper has already run the full packaging/live gate before
      # it creates the signed source tag, so this stage does not repeat that
      # installer workload.
      # Main CI is already green at the exact candidate SHA. This graph runs
      # only release-specific sibling proofs. Make declares the repository
      # dependencies and the checkpoint controller retains each exact-input
      # success so a corrected rerun resumes at the first invalid stage.
      - name: Run recoverable hosted release graph
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          checkpoint_root="${RELEASE_BUILD_STATE_ROOT}/checkpoints"
          mkdir -p "${checkpoint_root}"
          HAWKEYE="${GITHUB_WORKSPACE}/container-compose/.local/bin/hawkeye" \
          CONTAINER_STACK_VALIDATION_CHECKPOINT_DIR="${checkpoint_root}" \
          STACK_SOURCE_ROOT="${GITHUB_WORKSPACE}" \
          CONTAINER_BUILDER_SHIM_STACK_REPO="${GITHUB_WORKSPACE}/container-builder-shim" \
          CONTAINERIZATION_STACK_REPO="${GITHUB_WORKSPACE}/containerization" \
          CONTAINER_STACK_REPO="${GITHUB_WORKSPACE}/container" \
          HOMEBREW_TAP_REPO="${GITHUB_WORKSPACE}/homebrew-tap" \
            make -C release-tools release-gate-hosted

      - name: Create candidate-bound authority receipt
        id: authority-receipt
        env:
          RELEASE_TAG: ${{ inputs.ref }}
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.sha }}
          BUILDER_REF: ${{ steps.stack-refs.outputs.container_builder_shim_ref }}
          CONTAINERIZATION_REF: ${{ steps.stack-refs.outputs.containerization_ref }}
          CONTAINER_REF: ${{ steps.stack-refs.outputs.container_ref }}
          HOMEBREW_TAP_REF: ${{ needs.resolve-candidate.outputs.homebrew_tap_ref }}
          INIT_IMAGE_SHA256: ${{ needs.resolve-candidate.outputs.init_image_sha256 }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          evidence="${RELEASE_BUILD_STATE_ROOT}/checkpoints/compose-release-gate"
          bundle="${RELEASE_BUILD_STATE_ROOT}/authority/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "${bundle}" || -L "${bundle}" ]]; then
            printf 'stable release authority bundle already exists: %s\n' "${bundle}" >&2
            exit 2
          fi
          mkdir -p "$(dirname "${bundle}")"
          mkdir "${bundle}"
          checkpoint="${evidence}/hosted-sibling-stack.success.json"
          output_name="$(python3 - "${checkpoint}" <<'PY'
          import json
          import sys

          print(json.load(open(sys.argv[1], encoding="utf-8"))["output_file"])
          PY
          )"
          if [[ -z "${output_name}" ]] || [[ "${output_name}" != "$(basename "${output_name}")" ]]; then
            printf 'stable release checkpoint output name is unsafe: %s\n' "${output_name}" >&2
            exit 2
          fi
          cp "${checkpoint}" "${bundle}/"
          cp "${evidence}/${output_name}" "${bundle}/"
          receipt_sha256="$(
            python3 release-tools/Tools/release/stable-release-authority.py create \
              --evidence-dir "${bundle}" \
              --receipt "${bundle}/stable-release-authority.json" \
              --release-tag "${RELEASE_TAG}" \
              --candidate-sha "${CANDIDATE_SHA}" \
              --builder-ref "${BUILDER_REF}" \
              --containerization-ref "${CONTAINERIZATION_REF}" \
              --container-ref "${CONTAINER_REF}" \
              --homebrew-tap-ref "${HOMEBREW_TAP_REF}" \
              --init-image-sha256 "${INIT_IMAGE_SHA256}"
          )"
          [[ "${receipt_sha256}" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "${receipt_sha256}" >> "${GITHUB_OUTPUT}"
          printf 'RELEASE_AUTHORITY_ROOT=%s\n' "${bundle}" >> "${GITHUB_ENV}"

      - name: Upload candidate-bound authority receipt
        id: upload-authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stable-release-authority-${{ inputs.ref }}-${{ needs.resolve-candidate.outputs.sha }}
          path: ${{ env.RELEASE_AUTHORITY_ROOT }}
          if-no-files-found: error
          retention-days: 90

  record-release-authority:
    name: Record Stable Release Authority
    needs: [resolve-candidate, release-gate]
    if: >-
      github.repository == 'stephenlclarke/container-compose' &&
      needs.release-gate.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
    steps:
      - name: Record candidate-bound stable release authority
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.ref }}
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.sha }}
          AUTHORITY_REF: ${{ needs.resolve-candidate.outputs.authority_ref }}
          CONTROL_SHA: ${{ needs.resolve-candidate.outputs.control_sha }}
          INIT_IMAGE_SHA256: ${{ needs.resolve-candidate.outputs.init_image_sha256 }}
          INIT_IMAGE_AUTHORITY_OBJECT: ${{ needs.resolve-candidate.outputs.init_image_authority_object }}
          AUTHORITY_ARTIFACT_DIGEST: ${{ needs.release-gate.outputs.authority_artifact_digest }}
          AUTHORITY_ARTIFACT_ID: ${{ needs.release-gate.outputs.authority_artifact_id }}
          AUTHORITY_RECEIPT_SHA256: ${{ needs.release-gate.outputs.authority_receipt_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          authority_sha="$(
            git ls-remote --heads "${remote}" "refs/heads/${AUTHORITY_REF}" |
              awk '{ print $1 }' |
              tail -n 1
          )"
          if [[ ! "${CONTROL_SHA}" =~ ^[0-9a-f]{40}$ ]] ||
            [[ "${GITHUB_SHA}" != "${CONTROL_SHA}" ]]; then
            printf 'stable release control identity changed: expected %s, got %s\n' \
              "${CONTROL_SHA:-missing}" "${GITHUB_SHA}" >&2
            exit 75
          fi
          expected_authority_sha="${CANDIDATE_SHA}"
          if [[ "${AUTHORITY_REF}" == "main" ]]; then
            expected_authority_sha="${CONTROL_SHA}"
          fi
          tag_sha="$(
            git ls-remote --tags "${remote}" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" |
              awk '$2 ~ /\^\{\}$/ { print $1 }' |
              tail -n 1
          )"
          if [[ "${authority_sha}" != "${expected_authority_sha}" ]]; then
            printf 'release authority %s moved after validation: expected %s, got %s\n' \
              "${AUTHORITY_REF}" "${expected_authority_sha}" "${authority_sha:-missing}" >&2
            exit 75
          fi
          if [[ "${tag_sha}" != "${CANDIDATE_SHA}" ]]; then
            printf 'stable tag %s moved after validation: expected %s, got %s\n' \
              "${RELEASE_TAG}" "${CANDIDATE_SHA}" "${tag_sha:-missing}" >&2
            exit 75
          fi
          init_image_authority_tag="stable-init-image-authority/${RELEASE_TAG}"
          current_init_image_authority_object="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${init_image_authority_tag}" \
              --jq '.object.sha'
          )"
          if [[ "${current_init_image_authority_object}" != "${INIT_IMAGE_AUTHORITY_OBJECT}" ]]; then
            printf 'stable init-image authority tag moved after validation: expected %s, got %s\n' \
              "${INIT_IMAGE_AUTHORITY_OBJECT}" \
              "${current_init_image_authority_object:-missing}" >&2
            exit 75
          fi
          init_image_authority="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${current_init_image_authority_object}"
          )"
          if [[ "$(jq -r '.verification.verified' <<<"${init_image_authority}")" != "true" ]] ||
            [[ "$(jq -r '.object.sha' <<<"${init_image_authority}")" != "${CANDIDATE_SHA}" ]]; then
            printf 'stable init-image authority no longer verifies the candidate source\n' >&2
            exit 75
          fi
          current_init_image_digest_lines="$(
            jq -r '.message' <<<"${init_image_authority}" |
              sed -nE 's/^Guest init image SHA-256: ([0-9a-f]{64})[.]$/\1/p'
          )"
          if [[ "${current_init_image_digest_lines}" != "${INIT_IMAGE_SHA256}" ]]; then
            printf 'stable init-image authority digest changed after validation\n' >&2
            exit 75
          fi
          if [[ ! "${AUTHORITY_ARTIFACT_ID}" =~ ^[0-9]+$ ]] ||
            [[ ! "${AUTHORITY_ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]] ||
            [[ ! "${AUTHORITY_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'stable release authority receipt outputs are invalid\n' >&2
            exit 75
          fi
          authority_name="Stable Release Authority (${RELEASE_TAG})"
          details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          summary="Hosted Stable Release Gate passed for immutable source"
          summary+=" ${CANDIDATE_SHA}."
          summary+=" Guest init image SHA-256: ${INIT_IMAGE_SHA256}."
          summary+=" Authority receipt SHA-256: ${AUTHORITY_RECEIPT_SHA256}."
          summary+=" Authority artifact ID: ${AUTHORITY_ARTIFACT_ID}."
          summary+=" Authority artifact digest: ${AUTHORITY_ARTIFACT_DIGEST}."
          check_run="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f "name=${authority_name}" \
              -f "head_sha=${CANDIDATE_SHA}" \
              -f 'status=completed' \
              -f 'conclusion=success' \
              -f "external_id=${GITHUB_RUN_ID}" \
              -f "details_url=${details_url}" \
              -f "output[title]=${authority_name}" \
              -f "output[summary]=${summary}"
          )"
          if ! jq -e \
            --arg name "${authority_name}" \
            --arg sha "${CANDIDATE_SHA}" \
            --arg run "${GITHUB_RUN_ID}" \
            '.name == $name and .head_sha == $sha and .external_id == $run and
              .status == "completed" and .conclusion == "success"' \
            <<<"${check_run}" >/dev/null; then
            printf 'stable release authority check output does not match its exact candidate\n' >&2
            exit 75
          fi
