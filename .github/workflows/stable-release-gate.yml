name: Stable Release Gate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Bare semantic tag to validate and promote"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: stable-release-gate-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  resolve-candidate:
    name: Resolve Stable Candidate
    if: github.repository == 'stephenlclarke/container-compose'
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      authority_ref: ${{ steps.candidate.outputs.authority_ref }}
      homebrew_tap_ref: ${{ steps.candidate.outputs.homebrew_tap_ref }}
    steps:
      - name: Require an immutable main tag and green main CI
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            printf 'stable release ref must be a bare semantic tag: %s\n' "${RELEASE_TAG}" >&2
            exit 1
          fi

          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          tag_sha="$(
            git ls-remote --tags "${remote}" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
              | awk '$2 ~ /\^\{\}$/ { print $1 }' \
              | tail -n 1
          )"
          if [[ -z "${tag_sha}" ]]; then
            tag_sha="$(
              git ls-remote --tags --refs "${remote}" "refs/tags/${RELEASE_TAG}" \
                | awk '{ print $1 }' \
                | tail -n 1
            )"
          fi
          main_sha="$(git ls-remote --heads "${remote}" refs/heads/main | awk '{ print $1 }' | tail -n 1)"
          if [[ ! "${tag_sha}" =~ ^[0-9a-f]{40}$ ]] || [[ -z "${main_sha}" ]]; then
            printf 'could not resolve stable tag %s or main\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]] ||
            [[ "${GITHUB_SHA}" != "${main_sha}" ]]; then
            printf 'stable release control must run from the exact current main revision (%s, got %s at %s)\n' \
              "${main_sha}" "${GITHUB_SHA}" "${GITHUB_REF}" >&2
            exit 1
          fi
          tag_object="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha'
          )"
          tag_verified="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified'
          )"
          if [[ "${tag_verified}" != "true" ]]; then
            printf 'stable tag %s is not GitHub-verified\n' "${RELEASE_TAG}" >&2
            exit 1
          fi

          release_output=""
          set +e
          release_output="$(
            gh api --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>&1
          )"
          release_status=$?
          set -e
          if (( release_status == 0 )); then
            printf 'stable release %s already exists and is immutable\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "${release_output}" != *"HTTP 404"* ]]; then
            printf 'could not determine whether stable release %s exists:\n%s\n' \
              "${RELEASE_TAG}" "${release_output}" >&2
            exit 1
          fi

          if [[ "${tag_sha}" != "${main_sha}" ]]; then
            printf 'stable tag %s no longer matches main; accepting its GitHub-verified unpublished source for a release retry\n' \
              "${RELEASE_TAG}"
          fi

          release_series="${RELEASE_TAG%.*}"
          release_branch="release-${release_series}"
          release_branch_sha="$(
            git ls-remote --heads "${remote}" "refs/heads/${release_branch}" |
              awk '{ print $1 }' |
              tail -n 1
          )"
          if [[ "${tag_sha}" == "${main_sha}" ]]; then
            authority_ref="main"
            candidate_ci_branch="main"
          elif [[ "${tag_sha}" == "${release_branch_sha}" ]]; then
            # Maintenance tags run the exact release-branch workflow on their
            # tag push, including the serialized Sonar candidate/restoration
            # transaction. Their immutable CI authority is therefore the tag.
            authority_ref="${release_branch}"
            candidate_ci_branch="${RELEASE_TAG}"
          else
            printf 'stable tag %s is neither current main nor exact %s head\n' \
              "${RELEASE_TAG}" "${release_branch}" >&2
            exit 1
          fi

          semantic_tags="$(
            git ls-remote --tags --refs "${remote}" \
              | awk '{ sub("^refs/tags/", "", $2); print $2 }' \
              | awk '/^[0-9]+[.][0-9]+[.][0-9]+$/'
          )"
          latest_stable_tag="$(sort -V <<<"${semantic_tags}" | tail -n 1)"
          if [[ "${authority_ref}" == "main" ]]; then
            if [[ "${latest_stable_tag}" != "${RELEASE_TAG}" ]]; then
              printf 'stable tag %s is not the latest semantic source tag (%s)\n' \
                "${RELEASE_TAG}" "${latest_stable_tag:-missing}" >&2
              exit 1
            fi
          else
            latest_series_tag="$(
              awk -v prefix="${release_series}." 'index($0, prefix) == 1' <<<"${semantic_tags}" |
                sort -V |
                tail -n 1
            )"
            if [[ "${latest_series_tag}" != "${RELEASE_TAG}" ]]; then
              printf 'maintenance tag %s is not the latest semantic tag in series %s (%s)\n' \
                "${RELEASE_TAG}" "${release_series}" "${latest_series_tag:-missing}" >&2
              exit 1
            fi
          fi

          homebrew_tap_ref="$(
            git ls-remote --heads https://github.com/stephenlclarke/homebrew-tap.git refs/heads/main \
              | awk '{ print $1 }' \
              | tail -n 1
          )"
          if [[ ! "${homebrew_tap_ref}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'could not resolve an immutable homebrew-tap main revision\n' >&2
            exit 1
          fi

          # Maintenance CI can legitimately consume its full 250-minute
          # runtime budget while waiting for and holding Sonar authority.
          deadline=$((SECONDS + 15600))
          sonar_evidence_attempts=0
          while true; do
            run="$(
              gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${tag_sha}" \
                --event push --limit 20 --json databaseId,status,conclusion,headBranch \
                --jq "map(select(.headBranch == \"${candidate_ci_branch}\") | select(.status == \"completed\" or .status == \"in_progress\" or .status == \"queued\")) | .[0] // empty"
            )"
            status="$(jq -r '.status // empty' <<<"${run}")"
            conclusion="$(jq -r '.conclusion // empty' <<<"${run}")"
            if [[ "${status}" == "completed" && "${conclusion}" == "success" ]]; then
              run_id="$(jq -r '.databaseId // empty' <<<"${run}")"
              ci_jobs="$(
                gh api --paginate --slurp \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100"
              )"
              sonar_conclusions="$(
                jq -c '[.[] | .jobs[] | select(.name == "Validate Runtime") |
                  .steps[]? | select(.name == "Record successful SonarQube analysis") | .conclusion]' \
                  <<<"${ci_jobs}"
              )"
              if jq -e 'length == 1 and .[0] == "success"' \
                <<<"${sonar_conclusions}" >/dev/null; then
                break
              fi
              if jq -e 'length == 0 or any(.[]; . == null)' \
                <<<"${sonar_conclusions}" >/dev/null; then
                ((sonar_evidence_attempts += 1))
                if (( sonar_evidence_attempts < 12 )); then
                  printf 'CI SonarQube evidence for run %s is not visible yet; retrying %s/12 in 5s\n' \
                    "${run_id}" "$((sonar_evidence_attempts + 1))"
                  sleep 5
                  continue
                fi
              fi
              printf '%s CI for %s did not complete the required SonarQube scan: %s\n' \
                "${candidate_ci_branch}" "${tag_sha}" "${sonar_conclusions}" >&2
              exit 1
            fi
            if [[ "${status}" == "completed" ]]; then
              printf '%s CI for %s concluded %s\n' \
                "${candidate_ci_branch}" "${tag_sha}" "${conclusion:-missing}" >&2
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              printf 'timed out waiting for green %s CI (including SonarQube) at %s\n' \
                "${candidate_ci_branch}" "${tag_sha}" >&2
              exit 1
            fi
            printf 'waiting for %s CI (including SonarQube) at %s\n' \
              "${candidate_ci_branch}" "${tag_sha}"
            sleep 30
          done

          {
            printf 'sha=%s\n' "${tag_sha}"
            printf 'authority_ref=%s\n' "${authority_ref}"
            printf 'homebrew_tap_ref=%s\n' "${homebrew_tap_ref}"
          } >> "$GITHUB_OUTPUT"

  release-gate:
    name: Run Hosted Release Gate
    needs: resolve-candidate
    runs-on: [self-hosted, macOS, ARM64, container-compose-release]
    timeout-minutes: 120
    env:
      RELEASE_PIPELINE_STATE_ROOT: /Volumes/SSD/github/.container-compose-release-pipeline
    steps:
      - name: Checkout the stable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: container-compose
          fetch-depth: 0
          ref: ${{ needs.resolve-candidate.outputs.sha }}

      # Stable tags are immutable, so use the immutable workflow revision for
      # release-control tooling while validating the tag checkout separately.
      - name: Checkout immutable stable-gate tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: release-tools
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Read exact stack refs
        id: stack-refs
        shell: bash
        working-directory: container-compose
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          components = json.loads(Path("Tools/release/stack-refs.json").read_text(encoding="utf-8"))["components"]
          for name in ("container-builder-shim", "containerization", "container"):
              ref = components[name]["ref"]
              if len(ref) != 40:
                  raise SystemExit(f"{name} ref is not immutable: {ref}")
              print(f"{name.replace('-', '_')}_ref={ref}")
          PY

      - name: Checkout pinned stack dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/container-builder-shim
          path: container-builder-shim
          fetch-depth: 0
          ref: ${{ steps.stack-refs.outputs.container_builder_shim_ref }}

      - name: Checkout pinned containerization dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/containerization
          path: containerization
          fetch-depth: 0
          ref: ${{ steps.stack-refs.outputs.containerization_ref }}

      - name: Checkout pinned runtime dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/container
          path: container
          fetch-depth: 0
          ref: ${{ steps.stack-refs.outputs.container_ref }}

      - name: Checkout immutable Homebrew tap snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/homebrew-tap
          path: homebrew-tap
          fetch-depth: 0
          ref: ${{ needs.resolve-candidate.outputs.homebrew_tap_ref }}

      - name: Verify immutable dependency checkouts
        env:
          BUILDER_REF: ${{ steps.stack-refs.outputs.container_builder_shim_ref }}
          CONTAINERIZATION_REF: ${{ steps.stack-refs.outputs.containerization_ref }}
          CONTAINER_REF: ${{ steps.stack-refs.outputs.container_ref }}
          HOMEBREW_TAP_REF: ${{ needs.resolve-candidate.outputs.homebrew_tap_ref }}
          CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C container-builder-shim rev-parse HEAD)" == "${BUILDER_REF}" ]]
          [[ "$(git -C containerization rev-parse HEAD)" == "${CONTAINERIZATION_REF}" ]]
          [[ "$(git -C container rev-parse HEAD)" == "${CONTAINER_REF}" ]]
          [[ "$(git -C homebrew-tap rev-parse HEAD)" == "${HOMEBREW_TAP_REF}" ]]
          [[ "$(git -C release-tools rev-parse HEAD)" == "${CONTROL_SHA}" ]]

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: container-compose/Tools/compose-normalizer/go.mod
          cache-dependency-path: container-compose/Tools/compose-normalizer/go.sum

      - name: Cache local repo tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            container-compose/.local/bin
            container-compose/.local/cache/hawkeye
          key: ${{ runner.os }}-${{ runner.arch }}-local-tools-hawkeye-v6.5.1

      - name: Provision checksum-pinned release tools
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        working-directory: container-compose
        run: |
          set -euo pipefail
          ./scripts/install-hawkeye.sh
          PIPELINE_STATE_ROOT="${RELEASE_PIPELINE_STATE_ROOT}" \
            make -C ../release-tools pipeline-bootstrap

      # GitHub-hosted macOS runners are VMs and cannot launch nested
      # Virtualization.framework guests. Hosted stack validation therefore uses
      # Container's native build, dSYM, docs, and unit-coverage targets rather
      # than the installer-staging target that builds Linux service workloads
      # with Colima. The release helper runs the full packaging/live gate on a
      # supported local Mac before it creates the signed source tag.
      # Main CI is already green at the exact candidate SHA. This graph runs
      # only release-specific sibling proofs, with one Swift-heavy lane and one
      # independent Go/Homebrew lane. Nextflow retains content-addressed stage
      # state so a corrected rerun resumes from the last valid output.
      - name: Run recoverable hosted release graph
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          BUILDER_REF: ${{ steps.stack-refs.outputs.container_builder_shim_ref }}
          CONTAINERIZATION_REF: ${{ steps.stack-refs.outputs.containerization_ref }}
          CONTAINER_REF: ${{ steps.stack-refs.outputs.container_ref }}
          HOMEBREW_TAP_REF: ${{ needs.resolve-candidate.outputs.homebrew_tap_ref }}
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.sha }}
        run: |
          set -euo pipefail
          pipeline_environment=(
            "PIPELINE_PROFILE=release-hosted"
            "PIPELINE_STATE_ROOT=${RELEASE_PIPELINE_STATE_ROOT}"
            "PIPELINE_EXECUTION_PATH=${GITHUB_WORKSPACE}/container-compose/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
            "PIPELINE_COMPOSE_REPO=${GITHUB_WORKSPACE}/container-compose"
            "PIPELINE_COMPOSE_REF=${CANDIDATE_SHA}"
            "PIPELINE_BUILDER_REPO=${GITHUB_WORKSPACE}/container-builder-shim"
            "PIPELINE_BUILDER_REF=${BUILDER_REF}"
            "PIPELINE_CONTAINERIZATION_REPO=${GITHUB_WORKSPACE}/containerization"
            "PIPELINE_CONTAINERIZATION_REF=${CONTAINERIZATION_REF}"
            "PIPELINE_CONTAINER_REPO=${GITHUB_WORKSPACE}/container"
            "PIPELINE_CONTAINER_REF=${CONTAINER_REF}"
            "PIPELINE_HOMEBREW_REPO=${GITHUB_WORKSPACE}/homebrew-tap"
            "PIPELINE_HOMEBREW_REF=${HOMEBREW_TAP_REF}"
          )
          resume_session=""
          history="${RELEASE_PIPELINE_STATE_ROOT}/.nextflow/history"
          if [[ -s "${history}" ]]; then
            resume_session="$(awk -F $'\t' 'NF >= 6 { value = $6 } END { print value }' "${history}")"
          fi
          if [[ "${resume_session}" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
            printf 'resuming content-addressed release graph session %s\n' "${resume_session}"
            env "${pipeline_environment[@]}" PIPELINE_SESSION="${resume_session}" \
              make -C release-tools pipeline-resume
          else
            env "${pipeline_environment[@]}" make -C release-tools pipeline
          fi

  record-release-authority:
    name: Record Stable Release Authority
    needs: [resolve-candidate, release-gate]
    if: >-
      github.repository == 'stephenlclarke/container-compose' &&
      needs.release-gate.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
    steps:
      - name: Record candidate-bound stable release authority
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.ref }}
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.sha }}
          AUTHORITY_REF: ${{ needs.resolve-candidate.outputs.authority_ref }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          authority_sha="$(
            git ls-remote --heads "${remote}" "refs/heads/${AUTHORITY_REF}" |
              awk '{ print $1 }' |
              tail -n 1
          )"
          tag_sha="$(
            git ls-remote --tags "${remote}" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" |
              awk '$2 ~ /\^\{\}$/ { print $1 }' |
              tail -n 1
          )"
          if [[ "${authority_sha}" != "${CANDIDATE_SHA}" ]]; then
            printf 'release authority %s moved after validation: expected %s, got %s\n' \
              "${AUTHORITY_REF}" "${CANDIDATE_SHA}" "${authority_sha:-missing}" >&2
            exit 75
          fi
          if [[ "${tag_sha}" != "${CANDIDATE_SHA}" ]]; then
            printf 'stable tag %s moved after validation: expected %s, got %s\n' \
              "${RELEASE_TAG}" "${CANDIDATE_SHA}" "${tag_sha:-missing}" >&2
            exit 75
          fi
          authority_name="Stable Release Authority (${RELEASE_TAG})"
          details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          summary="Hosted Stable Release Gate passed for immutable source"
          summary+=" ${CANDIDATE_SHA}."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f "name=${authority_name}" \
            -f "head_sha=${CANDIDATE_SHA}" \
            -f 'status=completed' \
            -f 'conclusion=success' \
            -f "external_id=${GITHUB_RUN_ID}" \
            -f "details_url=${details_url}" \
            -f "output[title]=${authority_name}" \
            -f "output[summary]=${summary}" \
            --silent
