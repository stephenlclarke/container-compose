name: Documentation

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - Tools/ci/classify-documentation-changes.py
      - docs/**
      - Package.resolved
      - Package.swift
      - README.md
      - Sources/**
      - scripts/make-docs.sh
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - Tools/ci/classify-documentation-changes.py
      - docs/**
      - Package.resolved
      - Package.swift
      - README.md
      - Sources/**
      - scripts/make-docs.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify Documentation Changes
    runs-on: ubuntu-24.04
    outputs:
      build_docc: ${{ steps.classify.outputs.build_docc }}
    steps:
      - name: Checkout documentation controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify documented API and site inputs
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request)
              base="${PR_BASE_SHA}"
              head="${PR_HEAD_SHA}"
              ;;
            push)
              base="${BEFORE_SHA}"
              head="${HEAD_SHA}"
              if [[ "${base}" == 0000000000000000000000000000000000000000 ]]; then
                printf 'build_docc=true\n' >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              ;;
            *)
              printf 'build_docc=true\n' >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac
          classification="$(
            python3 Tools/ci/classify-documentation-changes.py \
              --repository . \
              --base "${base}" \
              --head "${head}" \
              --github-output "${GITHUB_OUTPUT}"
          )"
          reason="$(jq -r .reason <<<"${classification}")"
          build_docc="$(jq -r .build_docc <<<"${classification}")"
          printf "DocC build: \`%s\` — %s.\n" "${build_docc}" "${reason}" \
            >> "${GITHUB_STEP_SUMMARY}"

  build-sites:
    name: Build ${{ matrix.site }} DocC Site
    needs: classify-changes
    # Pull requests validate documentation classification and workflow syntax,
    # but product documentation is generated only by the post-merge authority.
    if: github.event_name != 'pull_request' && needs.classify-changes.outputs.build_docc == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - site: compose
            repository: stephenlclarke/container-compose
          - site: container
            repository: stephenlclarke/container
          - site: containerization
            repository: stephenlclarke/containerization
          - site: k8s
            repository: stephenlclarke/container-k8s
    steps:
      - name: Checkout ${{ matrix.site }} source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.site == 'compose' && github.sha || 'main' }}
          path: source

      - name: Build static API documentation
        env:
          SITE: ${{ matrix.site }}
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/_site"
          mkdir -p "${output}"
          case "${SITE}" in
            compose)
              (
                cd source
                scripts/make-docs.sh "${output}" container-compose
              )
              ;;
            container|containerization)
              (
                cd source
                scripts/make-docs.sh "${output}" "container-compose/${SITE}"
              )
              ;;
            k8s)
              (
                cd source
                /usr/bin/swift package \
                  --disable-automatic-resolution \
                  --allow-writing-to-directory "${output}" \
                  generate-documentation \
                  --target K8sCore \
                  --target K8sPlugin \
                  --output-path "${output}" \
                  --disable-indexing \
                  --transform-for-static-hosting \
                  --enable-experimental-combined-documentation \
                  --hosting-base-path container-compose/k8s \
                  --source-service github \
                  --source-service-base-url https://github.com/stephenlclarke/container-k8s/blob/main \
                  --checkout-path "$GITHUB_WORKSPACE/source"
              )
              printf '{}\n' > "${output}/theme-settings.json"
              cat > "${output}/index.html" <<'EOF'
          <!DOCTYPE html>
          <html lang="en-US">
            <head>
              <meta charset="utf-8">
              <title>Redirecting...</title>
              <meta http-equiv="refresh" content="0; url=./documentation/">
            </head>
            <body>
              <p>If you are not redirected automatically, <a href="./documentation/">click here</a>.</p>
            </body>
          </html>
          EOF
              ;;
            *)
              printf 'unsupported documentation site: %s\n' "${SITE}" >&2
              exit 1
              ;;
          esac

      - name: Archive DocC site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'stephenlclarke/container-compose'
        env:
          SITE: ${{ matrix.site }}
        run: tar -czf "${SITE}.tgz" -C _site .

      - name: Save DocC site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'stephenlclarke/container-compose'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-docs-${{ matrix.site }}
          path: ${{ matrix.site }}.tgz
          retention-days: 1

  upload-pages-artifact:
    name: Assemble and Upload GitHub Pages Artifact
    needs: build-sites
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'stephenlclarke/container-compose'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Download DocC sites
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: api-docs-*
          path: downloads
          merge-multiple: true

      - name: Assemble DocC portal
        run: |
          set -euo pipefail
          mkdir _site
          tar -xzf downloads/compose.tgz -C _site
          for site in container containerization k8s; do
            mkdir "_site/${site}"
            tar -xzf "downloads/${site}.tgz" -C "_site/${site}"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: upload-pages-artifact
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'stephenlclarke/container-compose'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
