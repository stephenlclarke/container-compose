name: Documentation
run-name: Documentation · ${{ inputs.ref }} · ${{ inputs.request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Published stable semantic tag"
        required: true
        type: string
      expected_control_sha:
        description: "Controller-observed main SHA for race-safe dispatch"
        required: false
        type: string
      request_id:
        description: "Durable controller request identifier"
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-release:
    name: Resolve Released Documentation Inputs
    if: github.repository == 'stephenlclarke/container-compose'
    runs-on: ubuntu-24.04
    outputs:
      compose_ref: ${{ steps.release.outputs.compose_ref }}
      compose_release_id: ${{ steps.release.outputs.release_id }}
      container_ref: ${{ steps.stack.outputs.container_ref }}
      containerization_ref: ${{ steps.stack.outputs.containerization_ref }}
      k8s_ref: ${{ steps.stack.outputs.k8s_ref }}
      k8s_release_id: ${{ steps.k8s-authority.outputs.release_id }}
      k8s_release_tag: ${{ steps.stack.outputs.k8s_release_tag }}
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - name: Verify dispatch identity
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [[ -n "${EXPECTED_CONTROL_SHA}" && \
            ( ! "${EXPECTED_CONTROL_SHA}" =~ ^[0-9a-f]{40}$ || \
              "${GITHUB_SHA}" != "${EXPECTED_CONTROL_SHA}" ) ]]; then
            printf 'documentation controls changed before execution: expected %s, got %s\n' \
              "${EXPECTED_CONTROL_SHA:-missing}" "${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ -n "${REQUEST_ID}" && ! "${REQUEST_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            printf 'documentation request ID is invalid: %s\n' "${REQUEST_ID}" >&2
            exit 1
          fi

      - name: Require exact published release inputs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.ref }}
        shell: bash
        run: |
          # shellcheck disable=SC2016 # awk programs intentionally use single quotes.
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            printf 'stable release ref must be a bare semantic tag: %s\n' \
              "${RELEASE_TAG}" >&2
            exit 1
          fi
          compose_remote="https://github.com/${GITHUB_REPOSITORY}.git"
          compose_ref="$(
            git ls-remote --tags "${compose_remote}" \
              "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
              | awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { direct = $1 } END { print peeled ? peeled : direct }'
          )"
          if [[ ! "${compose_ref}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'could not resolve published stable tag %s\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]] || \
            [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'documentation control must be dispatched from an immutable main revision, got %s at %s\n' \
              "${GITHUB_SHA}" "${GITHUB_REF}" >&2
            exit 1
          fi
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if [[ "$(jq -r '.draft or .prerelease' <<<"${release}")" != "false" ]] || \
            [[ "$(jq -r '.tag_name' <<<"${release}")" != "${RELEASE_TAG}" ]] || \
            [[ ! "$(jq -r '.id' <<<"${release}")" =~ ^[0-9]+$ ]]; then
            printf 'documentation requires a published stable release: %s\n' \
              "${RELEASE_TAG}" >&2
            exit 1
          fi
          printf 'compose_ref=%s\n' "${compose_ref}" >> "${GITHUB_OUTPUT}"
          printf 'release_id=%s\n' "$(jq -er '.id' <<<"${release}")" \
            >> "${GITHUB_OUTPUT}"
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "${latest_tag}" == "${RELEASE_TAG}" ]]; then
            printf 'deploy=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'deploy=false\n' >> "${GITHUB_OUTPUT}"
            printf 'Retaining documentation artifacts without replacing Pages because latest stable is %s.\n' \
              "${latest_tag}" >> "${GITHUB_STEP_SUMMARY}"
          fi
          printf 'Released documentation input: %s at %s.\n' \
            "${RELEASE_TAG}" "${compose_ref}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout tagged container-compose source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: release-source
          ref: ${{ steps.release.outputs.compose_ref }}

      - name: Resolve exact released stack refs
        id: stack
        working-directory: release-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import re
          from pathlib import Path

          manifest = json.loads(
              Path("Tools/release/stack-refs.json").read_text(encoding="utf-8")
          )
          if manifest.get("schemaVersion") != 1:
              raise SystemExit("unsupported released stack manifest")
          components = manifest.get("components", {})
          expected = {
              "container": "stephenlclarke/container",
              "containerization": "stephenlclarke/containerization",
          }
          for name, repository in expected.items():
              component = components.get(name, {})
              ref = component.get("ref", "")
              if component.get("repository") != repository:
                  raise SystemExit(f"released {name} repository changed")
              if re.fullmatch(r"[0-9a-f]{40}", ref) is None:
                  raise SystemExit(f"released {name} ref is not immutable: {ref}")
              print(f"{name}_ref={ref}")

          documentation = json.loads(
              Path("Tools/release/documentation-refs.json").read_text(
                  encoding="utf-8"
              )
          )
          if documentation.get("schemaVersion") != 1:
              raise SystemExit("unsupported released documentation manifest")
          k8s = documentation.get("sites", {}).get("k8s", {})
          k8s_ref = k8s.get("ref", "")
          k8s_release_tag = k8s.get("releaseTag", "")
          if k8s.get("repository") != "stephenlclarke/container-k8s":
              raise SystemExit("released container-k8s repository changed")
          if re.fullmatch(r"[0-9a-f]{40}", k8s_ref) is None:
              raise SystemExit(
                  f"released container-k8s ref is not immutable: {k8s_ref}"
              )
          if not k8s_release_tag:
              raise SystemExit("released container-k8s tag is missing")
          print(f"k8s_ref={k8s_ref}")
          print(f"k8s_release_tag={k8s_release_tag}")
          PY

      - name: Verify released container-k8s authority
        id: k8s-authority
        env:
          GH_TOKEN: ${{ github.token }}
          K8S_REF: ${{ steps.stack.outputs.k8s_ref }}
          K8S_RELEASE_TAG: ${{ steps.stack.outputs.k8s_release_tag }}
        shell: bash
        run: |
          # shellcheck disable=SC2016 # awk programs intentionally use single quotes.
          set -euo pipefail
          k8s_remote="https://github.com/stephenlclarke/container-k8s.git"
          k8s_tag_ref="$(
            git ls-remote --tags "${k8s_remote}" \
              "refs/tags/${K8S_RELEASE_TAG}" \
              "refs/tags/${K8S_RELEASE_TAG}^{}" \
              | awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { direct = $1 } END { print peeled ? peeled : direct }'
          )"
          k8s_release="$(
            gh api \
              "repos/stephenlclarke/container-k8s/releases/tags/${K8S_RELEASE_TAG}"
          )"
          if [[ "$(jq -r '.draft' <<<"${k8s_release}")" != "false" ]] || \
            [[ "$(jq -r '.tag_name' <<<"${k8s_release}")" != "${K8S_RELEASE_TAG}" ]] || \
            [[ ! "$(jq -r '.id' <<<"${k8s_release}")" =~ ^[0-9]+$ ]] || \
            [[ "${k8s_tag_ref}" != "${K8S_REF}" ]]; then
            printf 'container-k8s ref is not attached to a published release: %s at %s\n' \
              "${K8S_RELEASE_TAG}" "${K8S_REF}" >&2
            exit 1
          fi
          printf 'release_id=%s\n' "$(jq -er '.id' <<<"${k8s_release}")" \
            >> "${GITHUB_OUTPUT}"

  build-sites:
    name: Build ${{ matrix.site }} DocC Site
    needs: resolve-release
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      # Preserve every independently successful immutable site when a sibling
      # fails so a retry can restore it instead of rebuilding all four.
      fail-fast: false
      matrix:
        include:
          - site: compose
            repository: stephenlclarke/container-compose
            ref: ${{ needs.resolve-release.outputs.compose_ref }}
          - site: container
            repository: stephenlclarke/container
            ref: ${{ needs.resolve-release.outputs.container_ref }}
          - site: containerization
            repository: stephenlclarke/containerization
            ref: ${{ needs.resolve-release.outputs.containerization_ref }}
          - site: k8s
            repository: stephenlclarke/container-k8s
            ref: ${{ needs.resolve-release.outputs.k8s_ref }}
    steps:
      - name: Checkout immutable documentation controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          path: release-tools
          ref: ${{ github.sha }}

      - name: Checkout ${{ matrix.site }} source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: source

      - name: Verify exact documentation source
        env:
          EXPECTED_REF: ${{ matrix.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "${EXPECTED_REF}" ]]

      - name: Resolve documentation toolchain identity
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          identity="$(
            {
              xcodebuild -version
              /usr/bin/swift --version
              xcrun --sdk macosx --show-sdk-path
              xcrun --sdk macosx --show-sdk-version
            } | shasum -a 256 | awk '{print $1}'
          )"
          [[ "${identity}" =~ ^[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "${identity}" >> "${GITHUB_OUTPUT}"

      - name: Restore SwiftPM documentation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            source/.build
            source/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: docs-swiftpm-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.digest }}-${{ matrix.site }}-${{ matrix.ref }}-${{ hashFiles('source/Package.resolved') }}
          restore-keys: |
            docs-swiftpm-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.digest }}-${{ matrix.site }}-

      - name: Restore exact DocC site
        id: site-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _site
          key: docs-site-v3-${{ matrix.site }}-${{ matrix.ref }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('release-tools/.github/workflows/docs.yml', 'release-tools/Tools/ci/doc-site-manifest.py', 'source/Package.resolved', 'source/scripts/make-docs.sh') }}

      - name: Inspect restored DocC site
        id: site
        env:
          SITE: ${{ matrix.site }}
          SOURCE_REF: ${{ matrix.ref }}
          TOOLCHAIN_DIGEST: ${{ steps.toolchain.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          hosting_base_path="container-compose/${SITE}"
          [[ "${SITE}" == compose ]] && hosting_base_path=container-compose
          if [[ "${{ steps.site-cache.outputs.cache-hit }}" == true ]] && \
            python3 release-tools/Tools/ci/doc-site-manifest.py verify _site \
              --site "${SITE}" --source-ref "${SOURCE_REF}" \
              --toolchain-digest "${TOOLCHAIN_DIGEST}" \
              --hosting-base-path "${hosting_base_path}"; then
            printf 'reusable=true\n' >> "${GITHUB_OUTPUT}"
          else
            if [[ -d _site ]]; then
              find _site -depth -delete
            fi
            printf 'reusable=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Build static API documentation
        if: steps.site.outputs.reusable != 'true'
        env:
          DOCS_SOURCE_REFERENCE: ${{ matrix.ref }}
          SITE: ${{ matrix.site }}
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/_site"
          mkdir -p "${output}"
          case "${SITE}" in
            compose)
              (
                cd source
                scripts/make-docs.sh "${output}" container-compose
              )
              ;;
            container|containerization)
              (
                cd source
                scripts/make-docs.sh "${output}" "container-compose/${SITE}"
              )
              ;;
            k8s)
              (
                cd source
                /usr/bin/swift package \
                  --disable-automatic-resolution \
                  --allow-writing-to-directory "${output}" \
                  generate-documentation \
                  --target K8sCore \
                  --target K8sPlugin \
                  --output-path "${output}" \
                  --disable-indexing \
                  --transform-for-static-hosting \
                  --enable-experimental-combined-documentation \
                  --hosting-base-path container-compose/k8s \
                  --source-service github \
                  --source-service-base-url "https://github.com/stephenlclarke/container-k8s/blob/${DOCS_SOURCE_REFERENCE}" \
                  --checkout-path "$GITHUB_WORKSPACE/source"
              )
              printf '{}\n' > "${output}/theme-settings.json"
              cat > "${output}/index.html" <<'EOF'
          <!DOCTYPE html>
          <html lang="en-US">
            <head>
              <meta charset="utf-8">
              <title>Redirecting...</title>
              <meta http-equiv="refresh" content="0; url=./documentation/">
            </head>
            <body>
              <p>If you are not redirected automatically, <a href="./documentation/">click here</a>.</p>
            </body>
          </html>
          EOF
              ;;
            *)
              printf 'unsupported documentation site: %s\n' "${SITE}" >&2
              exit 1
              ;;
          esac

      - name: Record DocC site manifest
        if: steps.site.outputs.reusable != 'true'
        env:
          SITE: ${{ matrix.site }}
          SOURCE_REF: ${{ matrix.ref }}
          TOOLCHAIN_DIGEST: ${{ steps.toolchain.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          hosting_base_path="container-compose/${SITE}"
          [[ "${SITE}" == compose ]] && hosting_base_path=container-compose
          python3 release-tools/Tools/ci/doc-site-manifest.py create _site \
            --site "${SITE}" --source-ref "${SOURCE_REF}" \
            --toolchain-digest "${TOOLCHAIN_DIGEST}" \
            --hosting-base-path "${hosting_base_path}"

      - name: Verify reusable DocC site
        env:
          SITE: ${{ matrix.site }}
          SOURCE_REF: ${{ matrix.ref }}
          TOOLCHAIN_DIGEST: ${{ steps.toolchain.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          hosting_base_path="container-compose/${SITE}"
          [[ "${SITE}" == compose ]] && hosting_base_path=container-compose
          python3 release-tools/Tools/ci/doc-site-manifest.py verify _site \
            --site "${SITE}" --source-ref "${SOURCE_REF}" \
            --toolchain-digest "${TOOLCHAIN_DIGEST}" \
            --hosting-base-path "${hosting_base_path}"
          printf 'DocC site ready for %s (verified reuse: %s).\n' \
            "${SITE}" "${{ steps.site.outputs.reusable }}"

      - name: Verify documentation source remained exact
        env:
          EXPECTED_REF: ${{ matrix.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "${EXPECTED_REF}" ]]
          [[ -z "$(git -C source status --porcelain --untracked-files=no)" ]]

      - name: Archive DocC site
        env:
          SITE: ${{ matrix.site }}
        run: tar -czf "${SITE}.tgz" -C _site .

      - name: Save DocC site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-docs-${{ inputs.ref }}-${{ matrix.site }}-${{ matrix.ref }}
          path: ${{ matrix.site }}.tgz
          retention-days: 30

  upload-pages-artifact:
    name: Assemble and Upload GitHub Pages Artifact
    needs:
      - resolve-release
      - build-sites
    if: needs.resolve-release.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Download DocC sites
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: api-docs-${{ inputs.ref }}-*
          path: downloads
          merge-multiple: true

      - name: Assemble DocC portal
        run: |
          set -euo pipefail
          mkdir _site
          tar -xzf downloads/compose.tgz -C _site
          for site in container containerization k8s; do
            mkdir "_site/${site}"
            tar -xzf "downloads/${site}.tgz" -C "_site/${site}"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs:
      - resolve-release
      - upload-pages-artifact
    if: needs.resolve-release.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: documentation-pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout immutable documentation controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          path: release-tools
          ref: ${{ github.sha }}

      - name: Verify immutable documentation controls
        env:
          RELEASE_CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C release-tools rev-parse HEAD)" == "${RELEASE_CONTROL_SHA}" ]]
          [[ -z "$(git -C release-tools status --porcelain --untracked-files=no)" ]]

      - name: Confirm release still owns Pages
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name'
          )"
          if [[ "${latest_tag}" == "${RELEASE_TAG}" ]]; then
            printf 'deploy=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'deploy=false\n' >> "${GITHUB_OUTPUT}"
            printf 'Skipping superseded Pages deployment for %s; latest stable is now %s.\n' \
              "${RELEASE_TAG}" "${latest_tag}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Re-resolve documentation authority before deployment
        id: authority
        if: steps.latest.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          authority="$(
            python3 release-tools/Tools/release/documentation-authority.py \
              --compose-repository "${GITHUB_REPOSITORY}" \
              --compose-tag "${{ inputs.ref }}" \
              --compose-release-id "${{ needs.resolve-release.outputs.compose_release_id }}" \
              --compose-ref "${{ needs.resolve-release.outputs.compose_ref }}" \
              --component "stephenlclarke/container=${{ needs.resolve-release.outputs.container_ref }}" \
              --component "stephenlclarke/containerization=${{ needs.resolve-release.outputs.containerization_ref }}" \
              --k8s-repository stephenlclarke/container-k8s \
              --k8s-tag "${{ needs.resolve-release.outputs.k8s_release_tag }}" \
              --k8s-release-id "${{ needs.resolve-release.outputs.k8s_release_id }}" \
              --k8s-ref "${{ needs.resolve-release.outputs.k8s_ref }}"
          )"
          printf 'digest=%s\n' "${authority}" >> "${GITHUB_OUTPUT}"

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.latest.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Verify documentation authority after deployment
        if: steps.latest.outputs.deploy == 'true'
        env:
          EXPECTED_AUTHORITY: ${{ steps.authority.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C release-tools rev-parse HEAD)" == "${RELEASE_CONTROL_SHA}" ]]
          [[ -z "$(git -C release-tools status --porcelain --untracked-files=no)" ]]
          current="$(
            python3 release-tools/Tools/release/documentation-authority.py \
              --compose-repository "${GITHUB_REPOSITORY}" \
              --compose-tag "${{ inputs.ref }}" \
              --compose-release-id "${{ needs.resolve-release.outputs.compose_release_id }}" \
              --compose-ref "${{ needs.resolve-release.outputs.compose_ref }}" \
              --component "stephenlclarke/container=${{ needs.resolve-release.outputs.container_ref }}" \
              --component "stephenlclarke/containerization=${{ needs.resolve-release.outputs.containerization_ref }}" \
              --k8s-repository stephenlclarke/container-k8s \
              --k8s-tag "${{ needs.resolve-release.outputs.k8s_release_tag }}" \
              --k8s-release-id "${{ needs.resolve-release.outputs.k8s_release_id }}" \
              --k8s-ref "${{ needs.resolve-release.outputs.k8s_ref }}"
          )"
          if [[ "${current}" != "${EXPECTED_AUTHORITY}" ]]; then
            printf 'documentation authority changed while Pages deployed\n' >&2
            exit 1
          fi
