name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      documentation_pr:
        description: "Optional documentation-only pull request number to validate"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # A replacement branch build can safely supersede stale work. A stable tag
  # transaction must finish its candidate scan and canonical-main restoration.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - name: Checkout for push diff
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          DOCUMENTATION_PR: ${{ inputs.documentation_pr }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files="${RUNNER_TEMP}/changed-files.txt"

          # Stable tags are immutable release candidates. Always run the full
          # validation transaction instead of inferring their scope from a
          # synthetic tag-push diff (whose before SHA is all zeroes).
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            printf 'heavy=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" \
                --paginate \
                --jq '.[].filename' > "$changed_files"
              ;;
            push)
              if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
                printf 'heavy=true\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              before="${{ github.event.before }}"
              after="${GITHUB_SHA}"
              if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
                git diff-tree --no-commit-id --name-only -r "$after" > "$changed_files"
              else
                git diff --name-only "$before" "$after" > "$changed_files"
              fi
              ;;
            workflow_dispatch)
              if [[ -n "${DOCUMENTATION_PR}" ]]; then
                pr_metadata="$(
                  gh api "repos/${GITHUB_REPOSITORY}/pulls/${DOCUMENTATION_PR}"
                )"
                [[ "$(jq -r '.head.repo.full_name' <<<"${pr_metadata}")" == \
                  "${GITHUB_REPOSITORY}" ]]
                [[ "$(jq -r '.head.sha' <<<"${pr_metadata}")" == \
                  "${GITHUB_SHA}" ]]
                [[ "$(jq -r '.base.ref' <<<"${pr_metadata}")" == "main" ]]
                gh api "repos/${GITHUB_REPOSITORY}/pulls/${DOCUMENTATION_PR}/files" \
                  --paginate \
                  --jq '.[].filename' > "$changed_files"
              else
                printf 'heavy=true\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *)
              printf 'heavy=true\n' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          heavy=false
          while IFS= read -r path; do
            case "$path" in
              docs/upstream/*)
                heavy=true
                break
                ;;
              *.md|docs/*|Formula/*)
                ;;
              *)
                heavy=true
                break
                ;;
            esac
          done < "$changed_files"

          printf 'heavy=%s\n' "$heavy" >> "$GITHUB_OUTPUT"

  source_checks:
    name: Source Checks
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout container-compose
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: container-compose
          fetch-depth: 0

      - name: Resolve container ref
        id: container-ref
        shell: bash
        run: |
          set -euo pipefail
          ref="$(python3 container-compose/Tools/release/resolve-container-ref.py --stack-refs container-compose/Tools/release/stack-refs.json)"
          if [[ -z "$ref" ]]; then
            printf 'container ref is empty\n' >&2
            exit 1
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout container dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/container
          path: container
          ref: ${{ steps.container-ref.outputs.ref }}
          fetch-depth: 0

      - name: Checkout containerization evidence history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/containerization
          path: containerization
          fetch-depth: 0

      - name: Checkout builder evidence history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/container-builder-shim
          path: container-builder-shim
          fetch-depth: 0

      - name: Checkout Kubernetes evidence history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/container-k8s
          path: container-k8s
          fetch-depth: 0

      - name: Checkout Homebrew evidence history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/homebrew-tap
          path: homebrew-tap
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: container-compose/Tools/compose-normalizer/go.mod
          cache-dependency-path: container-compose/Tools/compose-normalizer/go.sum

      - name: Install Markdown lint
        run: npm install --global markdownlint-cli@0.48.0

      - name: Cache local repo tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: container-compose/.local/bin
          key: ${{ runner.os }}-${{ runner.arch }}-local-tools-hawkeye-v6.5.1

      - name: Run source checks
        timeout-minutes: 15
        run: make check
        working-directory: container-compose
        env:
          GH_TOKEN: ${{ github.token }}
          HAWKEYE_AUTO_INSTALL: "1"

  validate_runtime:
    name: Validate Runtime
    needs:
      - changes
      - resolve-canonical-main
    if: >
      needs.changes.outputs.heavy == 'true' &&
      needs.resolve-canonical-main.result == 'success'
    runs-on: [self-hosted, macOS, ARM64, container-compose-current]
    # Cover validation/coverage, CLI smoke, up to two queued maintenance
    # transactions, this transaction's two scans, and setup overhead.
    timeout-minutes: 250
    steps:
      - name: Checkout container-compose
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: container-compose
          fetch-depth: 0

      - name: Checkout canonical main recovery source
        if: needs.resolve-canonical-main.outputs.restore == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: sonar-main-recovery
          ref: ${{ needs.resolve-canonical-main.outputs.sha }}

      - name: Download retained canonical main coverage
        if: needs.resolve-canonical-main.outputs.restore == 'true'
        env:
          ARTIFACT_RUN_ID: ${{ needs.resolve-canonical-main.outputs.artifact_run_id }}
          EXPECTED_CANONICAL_MAIN_SHA: ${{ needs.resolve-canonical-main.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="sonar-main-inputs-${EXPECTED_CANONICAL_MAIN_SHA}"
          if [[ ! "${ARTIFACT_RUN_ID}" =~ ^[0-9]+$ ]]; then
            printf 'canonical main artifact run is invalid: %s\n' "${ARTIFACT_RUN_ID:-missing}" >&2
            exit 1
          fi
          gh run download "${ARTIFACT_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${artifact_name}" \
            --dir sonar-main-recovery
          test -s sonar-main-recovery/coverage.xml
          test -s sonar-main-recovery/Tools/compose-normalizer/coverage.out

      - name: Resolve stack refs
        id: stack-refs
        shell: bash
        working-directory: container-compose
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = Path("Tools/release/stack-refs.json")
          if not manifest.exists():
              print("containerization_ref=")
              raise SystemExit(0)

          data = json.loads(manifest.read_text(encoding="utf-8"))
          components = data.get("components", {})
          print(f"containerization_ref={components.get('containerization', {}).get('ref', '')}")
          PY

      - name: Resolve container ref
        id: container-ref
        shell: bash
        run: |
          set -euo pipefail
          ref="$(python3 container-compose/Tools/release/resolve-container-ref.py --stack-refs container-compose/Tools/release/stack-refs.json)"
          if [[ -z "$ref" ]]; then
            printf 'container ref is empty\n' >&2
            exit 1
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout container dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/container
          path: container
          ref: ${{ steps.container-ref.outputs.ref }}

      - name: Checkout containerization dependency
        if: steps.stack-refs.outputs.containerization_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stephenlclarke/containerization
          path: containerization
          ref: ${{ steps.stack-refs.outputs.containerization_ref }}

      - name: Verify container dependency ref
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C container rev-parse HEAD)"
          expected="${{ steps.container-ref.outputs.ref }}"
          if [[ "$actual" != "$expected" ]]; then
            printf 'container checkout mismatch: expected %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          fi

      - name: Verify containerization dependency ref
        if: steps.stack-refs.outputs.containerization_ref != ''
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C containerization rev-parse HEAD)"
          expected="${{ steps.stack-refs.outputs.containerization_ref }}"
          if [[ "$actual" != "$expected" ]]; then
            printf 'containerization checkout mismatch: expected %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          fi

      - name: Compute SwiftPM cache fingerprint
        id: swiftpm-cache
        shell: bash
        run: |
          set -euo pipefail
          {
            swift --version 2>&1
            printf 'container_ref=%s\n' "${{ steps.container-ref.outputs.ref }}"
            printf 'containerization_ref=%s\n' "${{ steps.stack-refs.outputs.containerization_ref }}"
            shasum -a 256 container-compose/Package.swift container-compose/Package.resolved
            shasum -a 256 container-compose/Makefile
            shasum -a 256 container/Package.swift container/Package.resolved
            if [[ -f containerization/Package.swift ]]; then
              shasum -a 256 containerization/Package.swift containerization/Package.resolved
            fi
          } | shasum -a 256 | awk '{ printf "fingerprint=%s\n", $1 }' >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            container-compose/.build
            container-compose/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-macos26-swiftpm-v2-${{ steps.swiftpm-cache.outputs.fingerprint }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-macos26-swiftpm-v2-

      - name: Use checked-out container dependency
        run: Tools/ci/use-stack-container.sh ../container
        working-directory: container-compose

      - name: Use checked-out containerization dependency
        if: steps.stack-refs.outputs.containerization_ref != ''
        run: Tools/ci/use-stack-containerization.sh ../containerization
        working-directory: container-compose

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: container-compose/Tools/compose-normalizer/go.mod
          cache-dependency-path: container-compose/Tools/compose-normalizer/go.sum

      - name: Print toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Run quick validation
        if: github.event_name == 'pull_request'
        timeout-minutes: 45
        run: make test go-build cli-smoke-built
        working-directory: container-compose
        env:
          HAWKEYE_AUTO_INSTALL: "1"

      - name: Run coverage gate
        if: >
          github.ref == 'refs/heads/main' ||
          github.ref_type == 'tag' ||
          github.event_name == 'workflow_dispatch'
        timeout-minutes: 45
        run: make coverage-check
        working-directory: container-compose
        env:
          HAWKEYE_AUTO_INSTALL: "1"

      - name: Retain canonical Sonar inputs
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7
        with:
          name: sonar-main-inputs-${{ github.sha }}
          path: |
            container-compose/coverage.xml
            container-compose/Tools/compose-normalizer/coverage.out
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Run built CLI smoke
        if: >
          github.ref == 'refs/heads/main' ||
          github.ref_type == 'tag' ||
          github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        run: make go-build cli-smoke-built
        working-directory: container-compose
        env:
          HAWKEYE_AUTO_INSTALL: "1"

      - name: Cache SonarQube packages
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Check SonarQube TCP availability
        id: sonar_tcp
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        env:
          SONAR_HOST: sonarcloud.io
          SONAR_PORT: "443"
        run: |
          set -euo pipefail
          if nc -z -w 5 "${SONAR_HOST}" "${SONAR_PORT}"; then
            printf 'available=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'available=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Check SonarQube API availability
        id: sonar_api
        if: >
          (github.ref == 'refs/heads/main' || github.ref_type == 'tag') &&
          steps.sonar_tcp.outputs.available == 'true'
        env:
          SONAR_STATUS_URL: https://sonarcloud.io/api/system/status
        run: |
          set -euo pipefail
          set +e
          status_code="$(curl --location --silent --show-error --connect-timeout 3 --max-time 5 \
            --write-out '%{http_code}' "${SONAR_STATUS_URL}" --output /dev/null)"
          curl_status="$?"
          set -e
          if [[ "${curl_status}" -eq 0 && "${status_code}" =~ ^[1-4][0-9][0-9]$ ]]; then
            printf 'available=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'available=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Install Sonar Scanner CLI
        id: sonar_install
        if: >
          (github.ref == 'refs/heads/main' || github.ref_type == 'tag') &&
          steps.sonar_tcp.outputs.available == 'true' &&
          steps.sonar_api.outputs.available == 'true'
        continue-on-error: true
        env:
          SONAR_SCANNER_GPG_FINGERPRINT: 679F1EE92B19609DE816FDE81DB198F93525EC1A
          SONAR_SCANNER_VERSION: 8.1.0.6389
        run: |
          case "$(uname -m)" in
            arm64)
              scanner_flavor="macosx-aarch64"
              ;;
            x86_64)
              scanner_flavor="macosx-x64"
              ;;
            *)
              printf 'Unsupported macOS architecture: %s\n' "$(uname -m)" >&2
              exit 1
              ;;
          esac

          scanner_name="sonar-scanner-cli-${SONAR_SCANNER_VERSION}-${scanner_flavor}"
          scanner_url="https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/${scanner_name}.zip"
          scanner_zip="${RUNNER_TEMP}/${scanner_name}.zip"
          scanner_signature="${scanner_zip}.asc"
          scanner_root="${RUNNER_TEMP}/sonar-scanner-cli"
          gpg_home="$(mktemp -d /private/tmp/container-compose-sonar-gpg.XXXXXX)"

          rm -rf "$scanner_root"
          mkdir -p "$scanner_root"
          chmod 700 "$gpg_home"
          gpgconf --homedir "$gpg_home" --launch gpg-agent
          trap 'gpgconf --homedir "$gpg_home" --kill gpg-agent 2>/dev/null || true; find "$gpg_home" -depth -delete' EXIT

          curl --fail --location --silent --show-error "$scanner_url" --output "$scanner_zip"
          curl --fail --location --silent --show-error "${scanner_url}.asc" --output "$scanner_signature"

          gpg --homedir "$gpg_home" --batch --keyserver hkps://keys.openpgp.org --recv-keys "$SONAR_SCANNER_GPG_FINGERPRINT"
          actual_fingerprint="$(
            gpg --homedir "$gpg_home" --batch --with-colons --fingerprint "$SONAR_SCANNER_GPG_FINGERPRINT" \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          if [[ "$actual_fingerprint" != "$SONAR_SCANNER_GPG_FINGERPRINT" ]]; then
            printf 'Unexpected Sonar Scanner signing key fingerprint: %s\n' "$actual_fingerprint" >&2
            exit 1
          fi

          gpg --homedir "$gpg_home" --batch --verify "$scanner_signature" "$scanner_zip"
          gpgconf --homedir "$gpg_home" --kill gpg-agent
          find "$gpg_home" -depth -delete
          trap - EXIT
          unzip -q "$scanner_zip" -d "$scanner_root"

          scanner_bin="${scanner_root}/sonar-scanner-${SONAR_SCANNER_VERSION}-${scanner_flavor}/bin"
          if [[ ! -x "${scanner_bin}/sonar-scanner" ]]; then
            printf 'Sonar Scanner binary was not found at %s\n' "$scanner_bin" >&2
            exit 1
          fi
          printf '%s\n' "$scanner_bin" >> "$GITHUB_PATH"

      - name: Record canonical restoration obligation
        id: sonar_restore_obligation
        if: >
          needs.resolve-canonical-main.outputs.restore == 'true' &&
          (github.ref == 'refs/heads/main' || github.ref_type == 'tag') &&
          steps.sonar_tcp.outputs.available == 'true' &&
          steps.sonar_api.outputs.available == 'true' &&
          steps.sonar_install.outcome == 'success'
        run: printf 'required=true\n' >> "${GITHUB_OUTPUT}"

      - name: SonarQube scan
        id: sonar_scan
        if: >
          (github.ref == 'refs/heads/main' || github.ref_type == 'tag') &&
          steps.sonar_tcp.outputs.available == 'true' &&
          steps.sonar_api.outputs.available == 'true' &&
          steps.sonar_install.outcome == 'success'
        continue-on-error: true
        # Two predecessor maintenance transactions can each hold the authority
        # for two 25-minute scan budgets. Leave 120 minutes for that queue and
        # 60 minutes for this candidate/restoration pair plus overhead.
        timeout-minutes: 180
        env:
          EXPECTED_CANONICAL_MAIN_SHA: ${{ needs.resolve-canonical-main.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUTHORITY_REF: ${{ needs.resolve-canonical-main.outputs.authority_ref }}
          RESTORE_CANONICAL_MAIN: ${{ needs.resolve-canonical-main.outputs.restore }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_QUALITYGATE_WAIT: "true"
        run: |
          set -euo pipefail
          sonar_timeout="$(command -v gtimeout || true)"
          if [[ -z "${sonar_timeout}" ]]; then
            printf 'gtimeout is required to bound each SonarQube invocation\n' >&2
            exit 1
          fi
          run_bounded_sonar_scan() {
            "${sonar_timeout}" --kill-after=30s 1500s make sonar-scan
          }
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_version="${GITHUB_REF_NAME#v}"
            if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'release tag is not semantic: %s\n' "${GITHUB_REF_NAME}" >&2
              exit 2
            fi
            release_output=""
            set +e
            release_output="$(
              gh api --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1
            )"
            release_status="$?"
            set -e
            if (( release_status == 0 )); then
              if [[ "${RESTORE_CANONICAL_MAIN}" == "true" ]]; then
                printf 'canonical_restore_completed=true\n' >> "${GITHUB_OUTPUT}"
              fi
              printf 'Skipping SonarQube scan for published release tag %s\n' "${GITHUB_REF_NAME}"
              exit 0
            fi
            if [[ "${release_output}" != *"HTTP 404"* ]]; then
              printf 'could not determine release state for tag %s:\n%s\n' "${GITHUB_REF_NAME}" "${release_output}" >&2
              exit "${release_status}"
            fi

            release_authority_sha="$(
              git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${RELEASE_AUTHORITY_REF}" |
                awk '{ print $1 }' |
                tail -n 1
            )"
            if [[ "${GITHUB_SHA}" != "${release_authority_sha}" ]]; then
              printf 'release tag %s is not the exact %s head (%s, got %s)\n' \
                "${GITHUB_REF_NAME}" "${RELEASE_AUTHORITY_REF}" "${release_authority_sha:-missing}" "${GITHUB_SHA}" >&2
              exit 2
            fi
            export SONAR_BRANCH="main"
          fi
          export CONTAINER_RUNTIME_LOCK_FILE="/tmp/container-compose-sonar-${UID}.lock"
          export CONTAINER_RUNTIME_LOCK_TIMEOUT_SECONDS=7200
          source Tools/ci/container-runtime-lock.sh
          acquire_container_runtime_lock
          trap release_container_runtime_lock EXIT
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            canonical_main_sha="$(
              git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main |
                awk '{ print $1 }' |
                tail -n 1
            )"
            if [[ "${canonical_main_sha}" != "${EXPECTED_CANONICAL_MAIN_SHA}" ]]; then
              printf 'canonical main moved after recovery preflight: expected %s, got %s\n' \
                "${EXPECTED_CANONICAL_MAIN_SHA}" "${canonical_main_sha:-missing}" >&2
              exit 75
            fi
            release_output=""
            set +e
            release_output="$(
              gh api --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1
            )"
            release_status="$?"
            set -e
            if (( release_status == 0 )); then
              if [[ "${RESTORE_CANONICAL_MAIN}" == "true" ]]; then
                printf 'canonical_restore_completed=true\n' >> "${GITHUB_OUTPUT}"
              fi
              printf 'Skipping SonarQube scan because release %s was published while waiting for authority\n' \
                "${GITHUB_REF_NAME}"
              exit 0
            fi
            if [[ "${release_output}" != *"HTTP 404"* ]]; then
              printf 'could not revalidate release state for tag %s:\n%s\n' \
                "${GITHUB_REF_NAME}" "${release_output}" >&2
              exit "${release_status}"
            fi
            release_authority_sha="$(
              git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${RELEASE_AUTHORITY_REF}" |
                awk '{ print $1 }' |
                tail -n 1
            )"
            if [[ "${GITHUB_SHA}" != "${release_authority_sha}" ]]; then
              printf 'release authority %s moved while tag %s waited (expected %s, got %s)\n' \
                "${RELEASE_AUTHORITY_REF}" "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${release_authority_sha:-missing}" >&2
              exit 75
            fi
          fi
          candidate_status=0
          set +e
          run_bounded_sonar_scan
          candidate_status="$?"
          set -e

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${RESTORE_CANONICAL_MAIN}" == "true" ]]; then
            restore_status=0
            set +e
            (
              cd ../sonar-main-recovery
              export SONAR_BRANCH=main
              export SONAR_QUALITYGATE_WAIT=true
              run_bounded_sonar_scan
            )
            restore_status="$?"
            set -e
            canonical_main_sha="$(
              git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main |
                awk '{ print $1 }' |
                tail -n 1
            )"
            if [[ "${canonical_main_sha}" != "${EXPECTED_CANONICAL_MAIN_SHA}" ]]; then
              printf 'canonical_restore_failed=true\n' >> "${GITHUB_OUTPUT}"
              printf 'canonical main moved during atomic release restoration: expected %s, got %s\n' \
                "${EXPECTED_CANONICAL_MAIN_SHA}" "${canonical_main_sha:-missing}" >&2
              exit 75
            fi
            if (( restore_status != 0 )); then
              printf 'canonical_restore_failed=true\n' >> "${GITHUB_OUTPUT}"
              printf 'atomic canonical main restoration failed with status %s\n' "${restore_status}" >&2
              exit "${restore_status}"
            fi
            printf 'canonical_restore_completed=true\n' >> "${GITHUB_OUTPUT}"
          fi
          exit "${candidate_status}"
        working-directory: container-compose

      # `continue-on-error` normalizes the public step conclusion. This marker
      # exists only when the scanner's raw outcome succeeded, so stable release
      # control can require durable unmasked evidence from the jobs API.
      - name: Record successful SonarQube analysis
        if: >
          (github.ref == 'refs/heads/main' || github.ref_type == 'tag') &&
          steps.sonar_scan.outcome == 'success'
        run: printf 'SonarQube analysis completed successfully.\n'

      - name: Enforce SonarQube failures when the service is available
        if: >
          (github.ref == 'refs/heads/main' || github.ref_type == 'tag') &&
          ((steps.sonar_restore_obligation.outputs.required == 'true' && steps.sonar_scan.outputs.canonical_restore_completed != 'true') || steps.sonar_tcp.outputs.available != 'true' || steps.sonar_api.outputs.available != 'true' || steps.sonar_install.outcome == 'failure' || steps.sonar_scan.outcome == 'failure')
        env:
          CANONICAL_RESTORE_COMPLETED: ${{ steps.sonar_scan.outputs.canonical_restore_completed }}
          CANONICAL_RESTORE_FAILED: ${{ steps.sonar_scan.outputs.canonical_restore_failed }}
          CANONICAL_RESTORE_REQUIRED: ${{ steps.sonar_restore_obligation.outputs.required }}
          SONAR_TCP_AVAILABLE: ${{ steps.sonar_tcp.outputs.available }}
          SONAR_API_AVAILABLE: ${{ steps.sonar_api.outputs.available }}
          SONAR_STATUS_URL: https://sonarcloud.io/api/system/status
        run: |
          set -euo pipefail
          if [[ "${CANONICAL_RESTORE_REQUIRED}" == "true" && "${CANONICAL_RESTORE_COMPLETED}" != "true" ]]; then
            printf 'Canonical Sonar restoration did not complete; failing closed.\n' >&2
            exit 1
          fi
          if [[ "${CANONICAL_RESTORE_FAILED}" == "true" ]]; then
            printf 'Canonical Sonar restoration failed; preserving the release validation failure.\n' >&2
            exit 1
          fi
          if [[ "${SONAR_TCP_AVAILABLE}" != "true" || "${SONAR_API_AVAILABLE}" != "true" ]]; then
            printf '::warning title=SonarQube unavailable::SonarQube TCP or API preflight failed within five seconds; skipping scanner installation and analysis.\n'
            {
              printf '## SonarQube scan deferred\n\n'
              printf 'The SonarQube TCP or API preflight failed within five seconds, so this external quality scan did not delay or fail CI. Local source checks, tests, coverage gates, and CodeQL remain required.\n'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          set +e
          status_code="$(curl --location --silent --show-error --connect-timeout 5 --max-time 15 \
            --retry 2 --retry-all-errors --write-out '%{http_code}' "${SONAR_STATUS_URL}" --output /dev/null)"
          curl_status="$?"
          set -e
          if [[ "${curl_status}" -eq 0 && "${status_code}" =~ ^[1-4][0-9][0-9]$ ]]; then
            printf 'SonarQube failed while its API is reachable; preserving the CI failure.\n' >&2
            exit 1
          fi
          printf '::warning title=SonarQube unavailable::Scanner installation or analysis failed while the SonarQube API was unavailable; local checks and coverage gates remain enforced.\n'
          {
            printf '## SonarQube scan deferred\n\n'
            printf 'The SonarQube API was unavailable after retries, so this external quality scan did not fail CI. Local source checks, tests, coverage gates, and CodeQL remain required.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

  resolve-canonical-main:
    name: Resolve Canonical Main
    runs-on: ubuntu-24.04
    outputs:
      artifact_run_id: ${{ steps.main.outputs.artifact_run_id }}
      authority_ref: ${{ steps.main.outputs.authority_ref }}
      sha: ${{ steps.main.outputs.sha }}
      restore: ${{ steps.main.outputs.restore }}
    steps:
      - name: Resolve canonical main and release state
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            {
              printf 'artifact_run_id=\n'
              printf 'authority_ref=\n'
              printf 'restore=false\n'
              printf 'sha=\n'
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          release_output=""
          set +e
          release_output="$(
            gh api --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1
          )"
          release_status="$?"
          set -e
          if (( release_status == 0 )); then
            {
              printf 'artifact_run_id=\n'
              printf 'authority_ref=\n'
              printf 'restore=false\n'
              printf 'sha=\n'
            } >> "${GITHUB_OUTPUT}"
            exit 0
          elif [[ "${release_output}" == *"HTTP 404"* ]]; then
            :
          else
            printf 'could not determine release state for tag %s:\n%s\n' \
              "${GITHUB_REF_NAME}" "${release_output}" >&2
            exit "${release_status}"
          fi

          main_sha="$(
            git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main |
              awk '{ print $1 }' |
              tail -n 1
          )"
          if [[ ! "${main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'canonical main SHA is unavailable: %s\n' "${main_sha:-missing}" >&2
            exit 1
          fi
          release_version="${GITHUB_REF_NAME#v}"
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'release tag is not semantic: %s\n' "${GITHUB_REF_NAME}" >&2
            exit 2
          fi
          release_branch="release-${release_version%.*}"
          release_branch_sha="$(
            git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${release_branch}" |
              awk '{ print $1 }' |
              tail -n 1
          )"
          if [[ "${GITHUB_SHA}" == "${main_sha}" ]]; then
            {
              printf 'artifact_run_id=\n'
              printf 'authority_ref=main\n'
              printf 'restore=false\n'
              printf 'sha=%s\n' "${main_sha}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${GITHUB_SHA}" != "${release_branch_sha}" ]]; then
            printf 'release tag %s is not the exact main or %s head (main %s, maintenance %s, got %s)\n' \
              "${GITHUB_REF_NAME}" "${release_branch}" "${main_sha}" "${release_branch_sha:-missing}" "${GITHUB_SHA}" >&2
            exit 2
          fi
          artifact_name="sonar-main-inputs-${main_sha}"
          run_ids="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow ci.yml \
              --commit "${main_sha}" \
              --limit 100 \
              --json databaseId,event,status,conclusion,headBranch,createdAt \
              --jq 'map(select(
                .headBranch == "main" and
                .status == "completed" and
                .conclusion == "success" and
                (.event == "push" or .event == "workflow_dispatch")
              )) | sort_by(.createdAt) | reverse | .[].databaseId'
          )"
          retained_inputs_available=false
          selected_run=""
          while IFS= read -r run_id; do
            if [[ -z "${run_id}" ]]; then
              continue
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | .name' |
              grep -Fxq "${artifact_name}"; then
              retained_inputs_available=true
              selected_run="${run_id}"
              break
            fi
          done <<< "${run_ids}"
          if [[ "${retained_inputs_available}" != "true" ]]; then
            printf 'release Sonar scan is unsafe: no retained %s artifact exists for canonical main %s\n' \
              "${artifact_name}" "${main_sha}" >&2
            exit 1
          fi
          {
            printf 'artifact_run_id=%s\n' "${selected_run}"
            printf 'authority_ref=%s\n' "${release_branch}"
            printf 'restore=true\n'
            printf 'sha=%s\n' "${main_sha}"
          } >> "${GITHUB_OUTPUT}"

  validate:
    name: Validate
    needs:
      - changes
      - source_checks
      - validate_runtime
      - resolve-canonical-main
    if: always() && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check parallel validation jobs
        env:
          RESOLVE_CANONICAL_MAIN_RESULT: ${{ needs.resolve-canonical-main.result }}
          SOURCE_CHECKS_RESULT: ${{ needs.source_checks.result }}
          VALIDATE_RUNTIME_RESULT: ${{ needs.validate_runtime.result }}
        run: |
          set -euo pipefail
          if [[ "${SOURCE_CHECKS_RESULT}" != "success" ]]; then
            printf 'Source Checks concluded %s\n' "${SOURCE_CHECKS_RESULT}" >&2
            exit 1
          fi
          if [[ "${VALIDATE_RUNTIME_RESULT}" != "success" ]]; then
            printf 'Validate Runtime concluded %s\n' "${VALIDATE_RUNTIME_RESULT}" >&2
            exit 1
          fi
          if [[ "${RESOLVE_CANONICAL_MAIN_RESULT}" != "success" && "${RESOLVE_CANONICAL_MAIN_RESULT}" != "skipped" ]]; then
            printf 'Resolve Canonical Main concluded %s\n' "${RESOLVE_CANONICAL_MAIN_RESULT}" >&2
            exit 1
          fi
          printf 'Source Checks and Validate Runtime passed, including any required atomic Sonar restoration.\n'

  validate-lightweight:
    # Branch protection requires one stable aggregate context for both the
    # full and documentation/formula-only validation paths.
    name: Validate
    needs: changes
    if: needs.changes.outputs.heavy != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout container-compose
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Markdown lint
        run: npm install --global markdownlint-cli@0.48.0

      - name: Validate Markdown and formula sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t markdown_files < <(git ls-files '*.md' | sort)
          if (( ${#markdown_files[@]} > 0 )); then
            markdownlint "${markdown_files[@]}"
          fi
          if [[ -f Tools/release/container-compose.rb.in ]]; then
            ruby -c Tools/release/container-compose.rb.in
          fi
