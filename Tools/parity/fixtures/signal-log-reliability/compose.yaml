services:
  foreground-json:
    image: alpine:3.21
    command:
      - sh
      - -c
      - >-
        printf 'FOREGROUND:EARLY:OUT\n';
        printf 'FOREGROUND:EARLY:ERR\n' >&2;
        sleep 1;
        printf 'FOREGROUND:LATE:OUT\n'
    logging:
      driver: json-file

  foreground-none:
    image: alpine:3.21
    command:
      - sh
      - -c
      - >-
        printf 'FOREGROUND:EARLY:OUT\n';
        printf 'FOREGROUND:EARLY:ERR\n' >&2;
        sleep 1;
        printf 'FOREGROUND:LATE:OUT\n'
    logging:
      driver: none

  restart-log:
    image: alpine:3.21
    command:
      - sh
      - -c
      - >-
        count=$$(cat /tmp/container-compose-restart-count 2>/dev/null || printf '0');
        count=$$((count + 1));
        printf '%s\n' "$$count" > /tmp/container-compose-restart-count;
        printf 'RESTART:%s\n' "$$count";
        while :; do sleep 1; done
    logging:
      driver: json-file

  scaled-log:
    image: alpine:3.21
    command:
      - sh
      - -c
      - >-
        printf 'SCALE:%s\n' "$$HOSTNAME"
    logging:
      driver: json-file

  signal:
    image: alpine:3.21
    stdin_open: true
    command:
      - sh
      - -c
      - >-
        trap 'printf "SIGNAL:INT\n"; exit 42' INT;
        printf 'SIGNAL:BOOT\n';
        read -r _;
        printf 'SIGNAL:READY\n';
        while :; do sleep 1; done

  tail-single:
    image: alpine:3.21
    command:
      - sh
      - -c
      - >-
        awk 'BEGIN {
          printf "START";
          for (i = 0; i < 3000; i++) printf "X";
          print "END"
        }'

  tail-multiple:
    image: alpine:3.21
    command:
      - sh
      - -c
      - >-
        awk 'BEGIN {
          for (line = 0; line < 3; line++) {
            value = sprintf("%c", 65 + line);
            for (i = 0; i < 800; i++) printf "%s", value;
            print ""
          }
        }'

  disconnect:
    image: alpine:3.21
    stdin_open: true
    command:
      - sh
      - -c
      - >-
        read -r _;
        printf 'STREAM:BEFORE\n';
        sleep 3;
        printf 'STREAM:AFTER\n'
