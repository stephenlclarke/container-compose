sonar.projectKey=stephenlclarke_container-compose2
sonar.organization=stephenlclarke
sonar.host.url=https://sonarcloud.io
sonar.projectName=container-compose

sonar.sources=Sources,Tools/compose-normalizer
sonar.tests=Tests
sonar.sourceEncoding=UTF-8

sonar.exclusions=.build/**,dist/**,**/.swiftpm/**,**/go.sum,**/*.png,Tools/compose-normalizer/**/*_test.go,Tools/coverage/**
sonar.coverage.exclusions=Package.swift,Tests/**,Sources/ComposePlugin/**,Sources/ComposeCore/ContainerExecLiveAdapter.swift,Sources/ComposeCore/ContainerImageLiveAdapter.swift,Sources/ComposeCore/ContainerLifecycleLiveAdapter.swift,Tools/compose-normalizer/**/*_test.go,Tools/coverage/**
sonar.coverageReportPaths=coverage.xml
sonar.go.coverage.reportPaths=Tools/compose-normalizer/coverage.out
sonar.qualitygate.wait=true

# Docker Engine routes, guest mount paths, and API-socket paths are protocol
# constants rather than deployment configuration. Long initializers preserve
# immutable Compose/Engine wire records, and keyword-shaped names preserve
# their public protocol spelling. Operational code remains analyzed normally.
sonar.issue.ignore.multicriteria=engineProtocolPaths,apiSocketProtocolPaths,runtimeSPIRecords,normalizedProjectRecords,archiveRecords,dependencyRecords,filesystemImportKeyword,createModelDefaultKeyword
sonar.issue.ignore.multicriteria.engineProtocolPaths.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.engineProtocolPaths.resourceKey=Sources/ComposeEngineRuntime/**
sonar.issue.ignore.multicriteria.apiSocketProtocolPaths.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.apiSocketProtocolPaths.resourceKey=Sources/ComposeCore/ComposeAPISocketTransform.swift
sonar.issue.ignore.multicriteria.runtimeSPIRecords.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.runtimeSPIRecords.resourceKey=Sources/ComposeRuntimeSPI/**
sonar.issue.ignore.multicriteria.normalizedProjectRecords.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.normalizedProjectRecords.resourceKey=Sources/ComposeCore/NormalizedProject.swift
sonar.issue.ignore.multicriteria.archiveRecords.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.archiveRecords.resourceKey=Sources/ComposeCore/ComposeArchiveManaging.swift
sonar.issue.ignore.multicriteria.dependencyRecords.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.dependencyRecords.resourceKey=Sources/ComposeCore/ComposeOrchestratorDependencies.swift
sonar.issue.ignore.multicriteria.filesystemImportKeyword.ruleKey=swift:S2961
sonar.issue.ignore.multicriteria.filesystemImportKeyword.resourceKey=Sources/ComposeContainerRuntime/ContainerFilesystemAdapter.swift
sonar.issue.ignore.multicriteria.createModelDefaultKeyword.ruleKey=swift:S2961
sonar.issue.ignore.multicriteria.createModelDefaultKeyword.resourceKey=Sources/ComposeRuntimeSPI/ComposeRuntimeCreateModels.swift
